            </div>

        <div class="lt-source-viewport" tabindex="0" aria-label="Source page, scroll to inspect"><img class="lt-source-image" alt="Modern Robotics, printed page 16, PDF page 36" width="1275" height="1651"></div>
        <p class="lt-source-error" role="alert" hidden>Could not load this page. <button class="lt-action" type="button" data-action="retry-source">Retry</button></p>

    </footer>
  </div>
  <section class="lt-settings-page" aria-labelledby="lt-settings-title" hidden>
    <button class="lt-action" type="button" data-action="back-settings">Back to reading</button>
    <h2 id="lt-settings-title" tabindex="-1">Settings</h2>
    <form id="lt-settings-form">
      <fieldset disabled>
        <label for="lt-model">Model<select id="lt-model" name="model"></select></label>
        <label for="lt-reasoning">Reasoning<select id="lt-reasoning" name="reasoning"></select></label>

  <dialog class="lt-link-picker" aria-label="Choose a discussion"></dialog>
  <dialog class="lt-usage-dialog" aria-label="Assistant usage"><button class="lt-action" type="button" data-action="close-usage">Close</button><div class="lt-usage-body"></div></dialog>
  <dialog class="lt-usage-dialog lt-copies-dialog" aria-label="Saved study copies"><button class="lt-action" type="button" data-action="close-copies">Close</button><div class="lt-copies-body"></div></dialog>
  <dialog class="lt-usage-dialog lt-reading-history" aria-label="Reading history"><button class="lt-action" type="button" data-action="close-history">Close</button><div class="lt-reading-history-body"></div></dialog>
  <input id="lt-restore-file" type="file" accept="application/json,.json" hidden>
  <script src="./book.js"></script>
  <script src="./study-store.js"></script>
  <script src="./study-sync.js"></script>
  <link rel="stylesheet" href="/vendor/katex/katex.min.css">
  <script src="/vendor/katex/katex.min.js"></script>
  <script src="./assistant-client.js"></script>
  <script src="./study-route.js"></script>
  <script src="./assistant-context.js"></script>
  <script src="./assistant-models.js"></script>
  <script src="./study-links.js"></script>
  <script src="./thread-examples.js"></script>
  <script>
  (() => {
    const root=document.getElementById('lt-reading');
    const q=s=>root.querySelector(s), qa=s=>[...root.querySelectorAll(s)];
    const threadExamples=window.LearningThreadExamples;
    const links=window.LearningStudyLinks;
    const assistant=window.LearningAssistant;
    root.addEventListener('load',event=>{
      const frame=event.target;if(!frame.matches?.('.lt-live-visual'))return;
      const message=activeNode().messages.find(m=>m.id===frame.closest('[data-message]')?.dataset.message);
      frame.contentWindow?.postMessage({type:'lt-visual-init',state:message?.artifactStates?.[frame.dataset.visualFile]||{}},'*');
    },true);
    window.addEventListener('message',event=>{
      if(!['lt-visual-state','lt-visual-size'].includes(event.data?.type))return;
      const frame=qa('.lt-live-visual').find(f=>f.contentWindow===event.source);if(!frame)return;
      if(event.data.type==='lt-visual-size'){if(Number.isFinite(event.data.height))frame.style.height=Math.min(1600,Math.max(320,event.data.height+2))+'px';return}
      const state=event.data.state;
      if(!state||typeof state!=='object'||Array.isArray(state))return;
      let serialized;try{serialized=JSON.stringify(state)}catch{return}if(serialized.length>8192)return;
      const message=activeNode().messages.find(m=>m.id===frame.closest('[data-message]')?.dataset.message);if(!message)return;
      (message.artifactStates||(message.artifactStates={}))[frame.dataset.visualFile]=JSON.parse(serialized);saveStudy();
    });
    const book=LearningBook,catalog=book.paragraphs;
    const blank=make=>Array.from({length:catalog.length},make);
    const runningRequests=new Set();
    let cloudSync=null,applyingCloud=false;
    let settingsOpen=false,settingsVersion=0,settingsLoad=0;
    const terms={R:'revolute',P:'prismatic',H:'helical',C:'cylindrical',U:'universal',S:'spherical'};
    const term=(key,name)=>`<button type="button" class="lt-term" data-joint="${key}" aria-pressed="false">${name} joint</button>`;
    const escapeText=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const paragraphs=catalog.map(p=>{
      let html=escapeText(p.text);
      if(p.jointDemo)for(const key of (p.number===1?['R','P','H']:['C','U','S']))html=html.replace(terms[key]+' joint',term(key,terms[key]));
      return html;
    });
    const clean=s=>{const t=document.createElement('div');t.innerHTML=s;return t.textContent};
    const states={R:[40],P:[35],H:[90],C:[40,30],U:[25,20],S:[25,20,15]};
    const defs={
      R:{controls:[['Angle',-140,140,'°']],caption:'The moving link turns around one fixed axis.',dof:1},
      P:{controls:[['Travel',0,100,'%']],caption:'The moving link slides along one fixed axis.',dof:1},
      H:{controls:[['Turn',0,360,'°']],caption:'Turning also moves the nut along the screw. They are linked.',dof:1},
      C:{controls:[['Angle',-140,140,'°'],['Travel',0,100,'%']],caption:'Rotate and slide independently: two controls, two freedoms.',dof:2},
      U:{controls:[['First hinge',-60,60,'°'],['Second hinge',-60,60,'°']],caption:'Two hinges, with their axes at right angles.',dof:2},
      S:{controls:[['Tilt',-60,60,'°'],['Swing',-60,60,'°'],['Twist',-140,140,'°']],caption:'The link can turn about three axes through the joint.',dof:3}
    };
    let page=book.first,joint='R',stack=[],read=new Set(),notes=blank(()=>''),noteOpen=blank(()=>false),highlights=blank(()=>[]),feedback='',animation=0,context=false,visits=[];
    let noteHistory=blank(()=>[]),noteEdits=blank(()=>null);
    let selection=null;
    let sourceOpen=false,sourceIndex=0,sourceParagraph=null;
    const sourcePages=catalog.map(p=>p.sourcePages.map(printed=>({printed,pdf:printed+20,asset:`/source-pages/modern-robotics-p${printed}.png`})));
    function showSource(open){
      sourceOpen=open;root.classList.toggle('lt-source-open',open);q('.lt-source-page').hidden=!open;q('.lt-demo').hidden=open||!catalog[page].jointDemo;
      const pages=sourcePages[page],button=q('[data-action="toggle-source"]'),img=q('.lt-source-image'),select=q('#lt-source-select');
      if(sourceParagraph!==page){sourceIndex=0;sourceParagraph=page;select.innerHTML=pages.map((p,i)=>`<option value="${i}">Printed p. ${p.printed} · PDF ${p.pdf}</option>`).join('')}
      select.hidden=pages.length===1;select.value=sourceIndex;
      const source=pages[sourceIndex];
      button.setAttribute('aria-expanded',String(open));button.textContent=pages.length===1?'Source p. '+source.printed:'Source pp. '+pages[0].printed+'–'+pages.at(-1).printed;
      if(open&&img.getAttribute('src')!==source.asset){img.src=source.asset;img.alt=`Modern Robotics, printed page ${source.printed}, PDF page ${source.pdf}`;img.classList.remove('lt-zoomed');q('[data-action="zoom-source"]').textContent='Zoom in';q('[data-action="zoom-source"]').setAttribute('aria-pressed','false')}
    }
    q('#lt-source-select').addEventListener('change',event=>{sourceIndex=+event.target.value;showSource(true)});
    q('.lt-source-image').addEventListener('error',()=>{q('.lt-source-error').hidden=false;q('.lt-source-viewport').hidden=true});
    q('.lt-source-image').addEventListener('load',()=>{q('.lt-source-error').hidden=true;q('.lt-source-viewport').hidden=false});
    let selectedSource=null;
    const newId=prefix=>prefix+'-'+(crypto.randomUUID?.()||Date.now().toString(36)+'-'+Array.from(crypto.getRandomValues(new Uint32Array(4)),n=>n.toString(36)).join('-'));
    const makeNode=(id,title)=>({id,title,page,parent:null,path:[],messages:[],draft:'',quote:'',replyTo:null,status:'',busy:false,visual:null});
    const conversations=new Map(catalog.map((_,p)=>['p'+p,book.root(p)]));
    const activeNode=()=>conversations.get(stack.length?stack.at(-1).id:'p'+page);

    const routes=LearningStudyRoute;
    let routingReady=false,applyingRoute=false;
    const discussionHref=(thread,message=null)=>routes.href(location.href,{book:LearningStudyStore.BOOK,thread,message});
    const entryHref=entry=>discussionHref(entry.nodeId,entry.messageId);
    function writeRoute(message=null,replace=false){
      if(applyingRoute||applyingCloud)return;
      const target=new URL(discussionHref(activeNode().id,message));
      if(settingsOpen)target.hash='settings';
      const url=target.href;
      q('.lt-route-error').hidden=true;
      if(location.href!==url)history[replace?'replaceState':'pushState'](null,'',url);
    }
    function applyRoute(focus=true){
      try{
        const route=routes.parse(location.href);
        if(!route){writeRoute(null,true);return}
        const {node,message}=routes.resolve(route,LearningStudyStore.BOOK,conversations);
        applyingRoute=true;
        try{if(node.id!==activeNode().id)reopen(node.id)}finally{applyingRoute=false}
        q('.lt-route-error').hidden=true;
        if(message&&focus&&!settingsOpen)requestAnimationFrame(()=>{const target=q('#lt-message-'+message.id);target?.scrollIntoView({block:'start'});target?.focus({preventScroll:true})});
        saveStudy();
      }catch(error){const box=q('.lt-route-error');box.querySelector('p').textContent=error.message;box.hidden=false}
    }

    const newAnchorId=()=> 'a'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);
    const isMessageAnchor=a=>a?.kind==='message';
    function messageText(message){return message.example?clean(threadExamples.examples[message.example].html()):message.kind==='live'?clean(assistant.renderText(message.text,{math:false,tables:false})):message.text}
    function sourceText(anchor,nodes=conversations){return isMessageAnchor(anchor)?messageText(nodes.get(anchor.nodeId).messages.find(m=>m.id===anchor.messageId)):clean(paragraphs[anchor.page])}
    function allAnchors(){
      const entries=new Map();
      for(const node of conversations.values()){
        if(node.sourceAnchor)entries.set(node.sourceAnchor.id,{anchor:node.sourceAnchor,nodeId:node.id,title:node.title});
        for(const m of node.messages)if(m.sourceAnchor)entries.set(m.sourceAnchor.id,{anchor:m.sourceAnchor,nodeId:node.id,messageId:m.id,title:m.text});
      }
      return [...entries.values()];
    }
    function historyHtml(history){return history?.length?`<details class="lt-revisions"><summary>History</summary>${[...history].reverse().map(r=>`<time datetime="${escapeText(r.at)}">${escapeText(new Date(r.at).toLocaleString())}</time><blockquote>${escapeText(r.text)}</blockquote>`).join('')}</details>`:''}
    function flushNoteEdits(){
      for(let i=0;i<notes.length;i++)if(noteEdits[i]!==null){links.revise(noteHistory[i],noteEdits[i],notes[i]);noteEdits[i]=null}
      for(const node of conversations.values())for(const m of node.messages)if(m.noteEditBase!==undefined){links.revise(m.noteHistory||(m.noteHistory=[]),m.noteEditBase,m.note||'');delete m.noteEditBase}
    }
    function rememberVisual(){if(settingsOpen)return;if(catalog[page].jointDemo)activeNode().visual={joint,values:[...states[joint]]};activeNode().scrollY=window.scrollY}
    function restoreReadingPosition(){if(settingsOpen)return;const y=activeNode().scrollY||0;requestAnimationFrame(()=>{if(!settingsOpen)window.scrollTo(0,y)})}
    const studyStore=LearningStudyStore.create(()=>window.localStorage);
    let studyReady=false,studyLoaded=false,lastStorageError='';
    function studySnapshot(){
      return {readingVersion:book.revision,visits,page,activeId:activeNode().id,joint,states,read:[...read],notes,noteOpen,noteHistory,noteEdits,highlights,design,
        conversations:[...conversations.values()].map(node=>({...node,busy:false,status:''}))};
    }
    function showStorageError(error){
      const box=q('.lt-storage-error');box.hidden=false;box.querySelector('p').textContent=error.message;
      q('[data-action="retry-save"]').hidden=!studyLoaded;
      if(lastStorageError!==error.message)console.error('Learning Threads persistence:',error);
      lastStorageError=error.message;
    }
    function saveStudy(){
      if(!studyReady||!studyLoaded)return;
      rememberVisual();
      try{const state=studySnapshot();studyStore.save(state);q('.lt-storage-error').hidden=true;lastStorageError='';if(!applyingCloud)cloudSync?.observe(state)}
      catch(error){showStorageError(error)}
    }
    function validateSourceLinks(saved){
      LearningStudyStore.validate(saved);
      for(let p=0;p<saved.highlights.length;p++)for(const h of saved.highlights[p])if(clean(paragraphs[p]).slice(h.start,h.end)!==h.quote)throw new Error('A saved highlight no longer matches this book. Export a backup.');
      const savedNodes=new Map(saved.conversations.map(n=>[n.id,n]));
      for(const node of saved.conversations)for(const a of [node.sourceAnchor,node.pendingAnchor,...node.messages.map(m=>m.sourceAnchor)].filter(Boolean))if(sourceText(a,savedNodes).slice(a.start,a.end)!==a.quote)throw new Error('A saved thread no longer matches its source. Export a backup.');
    }
    function loadStudy(provided){
      try{
        const original=provided||studyStore.load();studyLoaded=true;if(!original)return false;
        validateSourceLinks(original);const saved=LearningStudyStore.upgrade(original);
        // Never reattach an old highlight if a source passage has changed.
        validateSourceLinks(saved);
        page=saved.page;joint=saved.joint;Object.assign(states,saved.states);read=new Set(saved.read);notes=saved.notes;noteOpen=saved.noteOpen;highlights=saved.highlights;Object.assign(design,saved.design);
        noteHistory=saved.noteHistory||blank(()=>[]);noteEdits=saved.noteEdits||blank(()=>null);visits=saved.visits||[];
        conversations.clear();for(const node of saved.conversations)conversations.set(node.id,{...node,busy:false,status:''});
        stack=conversations.get(saved.activeId).path.map(step=>({...step,restoreValues:[...step.restoreValues]}));
        return true;
      }catch(error){studyLoaded=false;showStorageError(error);return false}
    }
    function exportStudy(target){
      flushNoteEdits();rememberVisual();
      const blob=new Blob([JSON.stringify(studyStore.backup(studySnapshot()),null,2)],{type:'application/json'});
      const url=URL.createObjectURL(blob),link=target||document.createElement('a');link.href=url;link.download='learning-threads-'+new Date().toISOString().slice(0,10)+'.json';
      if(!target){link.hidden=true;root.append(link);link.click();link.remove()}
      setTimeout(()=>URL.revokeObjectURL(url),30000);
    }
    async function savedCopies(before){
      const dialog=q('.lt-copies-dialog'),body=q('.lt-copies-body');if(!dialog.open)dialog.showModal();
      try{const result=await cloudSync.versions(before);body.innerHTML=result.versions.map(v=>`<div class="lt-actions"><button class="lt-action" type="button" data-open-copy="${v.version}">${escapeText(new Date(v.created).toLocaleString())}${v.accepted?'':' · other copy'}</button></div>`).join('')||(before?'No older copies.':'No saved copies.');if(result.versions.length===50)body.innerHTML+=`<button class="lt-quiet" type="button" data-older-copies="${result.versions.at(-1).version}">Older copies</button>`}
      catch(error){body.textContent=error.message}
    }
    async function previewCopy(version){
      const body=q('.lt-copies-body');
      try{
        const copy=await cloudSync.copy(version),state=copy.state;validateSourceLinks(state);
        const notes=state.notes.filter(Boolean).map(text=>`<blockquote>${escapeText(text)}</blockquote>`).join('');
        const work=state.conversations.filter(n=>n.messages.length||n.draft).map(n=>`<details><summary>${escapeText(n.title)}</summary>${n.messages.map(m=>`<p>${escapeText(m.text)}</p>${m.note?`<blockquote>${escapeText(m.note)}</blockquote>`:''}`).join('')}${n.draft?`<blockquote>${escapeText(n.draft)}</blockquote>`:''}</details>`).join('');
        body.innerHTML=`<p>${escapeText(new Date(copy.created).toLocaleString())} · ${escapeText(book.label(state.page))}</p>${notes}${work}<div class="lt-actions"><button class="lt-action" type="button" data-restore-copy="${version}">Restore this copy</button><button class="lt-action" type="button" data-action="saved-copies">All copies</button></div>`;
      }catch(error){body.textContent=error.message}
    }
    let syncConflict=false;
    function syncStatus({error,conflict=syncConflict}){
      syncConflict=conflict;
      const box=q('.lt-sync-error');box.hidden=!error&&!conflict;
      box.querySelector('p').textContent=error||'Study changed on another device. Both copies are saved.';
      q('[data-action="keep-local"]').hidden=!conflict;q('[data-action="keep-cloud"]').hidden=!conflict;q('[data-action="retry-sync"]').hidden=conflict;
    }
    function passageRange(start,end){
      const walker=document.createTreeWalker(q('#lt-passage'),NodeFilter.SHOW_TEXT),segments=[];
      let part,offset=0;while((part=walker.nextNode())){segments.push({node:part,start:offset,end:offset+part.length});offset+=part.length}
      const first=segments.find(s=>s.start<=start&&s.end>start),last=segments.find(s=>s.start<end&&s.end>=end);
      if(!first||!last)return null;
      const range=document.createRange();range.setStart(first.node,start-first.start);range.setEnd(last.node,end-last.start);return range;
    }
    function renderHighlights(){
      for(const h of [...highlights[page]].sort((a,b)=>b.start-a.start)){
        const range=passageRange(h.start,h.end);if(!range||range.toString()!==h.quote)continue;
        const mark=document.createElement('mark');mark.append(range.extractContents());range.insertNode(mark);
      }
    }
    function renderAskContext(){
      const node=activeNode(),box=q('.lt-ask-context');
      const message=node.replyTo?node.messages.find(m=>m.id===node.replyTo):null;
      box.hidden=!node.quote&&!message;
      box.innerHTML=(node.quote?`<span>Selected text</span><blockquote>${escapeText(node.quote)}</blockquote>`:message?'<span>Following up on the selected reply</span>':'')+`<div class="lt-context-actions"><button type="button" data-action="clear-ask-context">Clear selection</button><button type="button" data-action="branch-selection">Explore separately <span aria-hidden="true">↗</span></button></div>`;
    }
    function renderQA(){
      flushNoteEdits();
      const node=activeNode();
      node.busy=node.messages.some(m=>m.request&&['queued','running','connecting'].includes(m.request.state));
      q('.lt-compose label').textContent=node.messages.length?'Ask a follow-up':stack.length?'Ask about '+node.title.toLowerCase():'Ask about this paragraph';
      q('.lt-messages').innerHTML=node.messages.map(renderMessage).join('');
      q('#lt-question').value=node.draft;
      q('[data-action="ask-codex"]').disabled=node.busy||!node.draft.trim();
      q('.lt-qa-status').textContent=node.status;
      const children=[...conversations.values()].filter(n=>n.parent&&n.page===page);
      q('.lt-branches').hidden=!children.length||!!stack.length;
      q('.lt-branch-list').innerHTML=children.map(n=>`<button type="button" data-reopen="${n.id}" style="padding-left:${8+Math.min(n.path.length-1,4)*14}px"><i data-lucide="git-branch" aria-hidden="true"></i>${escapeText(n.title)}${n.id===node.id?' · here':''}</button>`).join('');
      renderAskContext();icons();threadExamples.drawVisuals(q('.lt-messages'),node.messages);
      for(const m of node.messages){const content=q(`#lt-message-${m.id} .lt-message-content`);if(content)links.decorate(content,allAnchors().filter(e=>isMessageAnchor(e.anchor)&&e.anchor.nodeId===node.id&&e.anchor.messageId===m.id),entryHref);}
    }
    function renderMessage(m){
      const example=m.example?threadExamples.examples[m.example]:null;
      const label=m.role==='user'?'You':'Assistant';
      const content=example?example.html():m.kind==='live'?assistant.renderText(m.text):escapeText(m.text);
      const hasVisual=activeNode().messages.some(other=>other.visualization?.sourceMessage===m.id);
      return `<article class="lt-message ${m.role==='user'?'lt-user':''} ${m.visualization?'lt-visual-message':''}" data-message="${m.id}" id="lt-message-${m.id}" tabindex="-1">
        <div class="lt-message-meta"><span>${label}</span><a class="lt-message-link" data-discussion-link href="${escapeText(discussionHref(activeNode().id,m.id))}" aria-label="Link to this ${m.role==='user'?'question':'answer'}">Link</a></div>
        ${m.sourceAnchor&&m.sourceAnchor.id!==activeNode().sourceAnchor?.id?`<button class="lt-message-quote lt-quote-return" type="button" data-source-return="${m.sourceAnchor.id}" aria-label="Back to highlight">${escapeText(m.sourceAnchor.quote)}</button>`:m.quote?`<div class="lt-message-quote">${escapeText(m.quote)}</div>`:''}
        ${m.visualization?'':m.editing?`<div class="lt-question-edit"><label for="lt-edit-${m.id}">Edit question</label><textarea id="lt-edit-${m.id}" data-edit-question="${m.id}">${escapeText(m.editDraft??m.text)}</textarea><div class="lt-actions"><button class="lt-action" type="button" data-save-question="${m.id}">Save question</button><button class="lt-action" type="button" data-cancel-question="${m.id}">Cancel</button></div></div>`:`<div class="lt-message-content ${example||m.kind==='live'?'lt-rich':''}">${content}</div>`}
        ${m.visualization?threadExamples.visualHtml(m):''}
        ${assistant.artifactHtml(m.artifacts)}
        ${m.request&&['connecting','queued','running','waiting','failed'].includes(m.request.state)?`<div class="lt-request-status" role="status">${m.request.error?escapeText(m.request.error):m.request.state==='queued'?'Queued…':'Thinking…'}</div>`:''}
        ${m.role==='assistant'?`<div class="lt-actions">
          ${m.visualKey?`<button class="lt-action" type="button" data-visualize="${m.id}"><i data-lucide="shapes" aria-hidden="true"></i>${hasVisual?'View visual':'Visualize'}</button>`:''}
          <button class="lt-action" type="button" data-follow="${m.id}">Ask follow-up</button>

      const pages=[page,...[...visits].reverse().map(v=>v.page),...read,...catalog.map((_,p)=>p).filter(p=>notes[p]||highlights[p].length||[...conversations.values()].some(n=>n.page===p&&(n.messages.length||n.draft)))];
      q('.lt-reading-history-body').innerHTML=[...new Set(pages)].map(p=>`<button class="lt-action" data-page="${p}" type="button" ${p===page?'aria-current="location"':''}><strong>${escapeText(book.label(p))}</strong><span>${escapeText(catalog[p].text.slice(0,130))}…</span></button>`).join('');
      q('.lt-reading-history').showModal();
    }
    function selectJoint(k){if(!defs[k])return;cancelAnimationFrame(animation);q('[data-action="animate"]').textContent='Play one motion';joint=k;buildControls()}
    function goPage(n){cancelAnimationFrame(animation);rememberVisual();stack=[];page=n;visit(n);const saved=activeNode().visual;joint=saved?saved.joint:n===0?'R':'C';if(saved)states[joint]=[...saved.values];feedback='';selection=null;selectedSource=null;q('.lt-note').hidden=true;render();restoreReadingPosition();writeRoute()}
    function enter(type,title,quote=''){
      cancelAnimationFrame(animation);rememberVisual();const parent=activeNode(),id=newId('b'),label=title||(type==='freedom'?'Degrees of freedom':'Independent motion');
      const node=makeNode(id,label);node.parent=parent.id;node.page=page;node.sourceQuote=quote;conversations.set(id,node);
      stack.push({id,type,title:label,restoreJoint:joint,restoreValues:[...states[joint]]});node.path=stack.map(s=>({...s,restoreValues:[...s.restoreValues]}));
      if(type!=='custom')joint=type==='freedom'?'H':'C';selection=null;selectedSource=null;render();writeRoute();
    }
    function backTo(depth){cancelAnimationFrame(animation);rememberVisual();while(stack.length>depth){const saved=stack.pop();joint=saved.restoreJoint;states[joint]=[...saved.restoreValues]}selection=null;selectedSource=null;render();restoreReadingPosition();writeRoute()}
    function reopen(id){const node=conversations.get(id);if(!node)return;cancelAnimationFrame(animation);rememberVisual();page=node.page;visit(page);stack=node.path.map(s=>({...s,restoreValues:[...s.restoreValues]}));if(node.visual){joint=node.visual.joint;states[joint]=[...node.visual.values]}selection=null;selectedSource=null;render();restoreReadingPosition();writeRoute()}
    root.addEventListener('click',e=>{
      const permalink=e.target.closest('[data-discussion-link]');
      if(permalink){if(e.metaKey||e.ctrlKey||e.shiftKey||e.altKey||e.button!==0)return;e.preventDefault();if(location.href!==permalink.href)history.pushState(null,'',permalink.href);applyRoute();return}
      const download=e.target.closest('[data-export-study]');if(download){exportStudy(download);return}
      const highlighted=e.target.closest('[data-source-links]');
      if(highlighted){if(e.metaKey||e.ctrlKey||e.shiftKey||e.altKey||e.button!==0)return;e.preventDefault();const selected=window.getSelection();if(selected&&!selected.isCollapsed&&root.contains(selected.anchorNode))return;chooseSource(highlighted);return}
      const btn=e.target.closest('button');if(!btn)return;
      if(btn.dataset.openCopy){previewCopy(+btn.dataset.openCopy);return}
      if(btn.dataset.olderCopies){savedCopies(+btn.dataset.olderCopies);return}
      if(btn.dataset.restoreCopy){cloudSync.copy(+btn.dataset.restoreCopy).then(copy=>{validateSourceLinks(copy.state);return cloudSync.restore(copy.state)}).then(()=>q('.lt-copies-dialog').close()).catch(error=>syncStatus({error:error.message}));return}
      if(q('.lt-link-picker').contains(btn))q('.lt-link-picker').close();
      if(btn.dataset.openSourceThread){openSourceThread(btn.dataset.openSourceThread);return}
      if(btn.dataset.sourceReturn){returnToSource(btn.dataset.sourceReturn);return}
      if(btn.dataset.editMessage){const m=activeNode().messages.find(m=>m.id===btn.dataset.editMessage);if(m.request&&['connecting','queued','running','waiting'].includes(m.request.state))return;m.editing=true;m.editDraft=m.text;renderQA();q('#lt-edit-'+m.id).focus();return}
      if(btn.dataset.cancelQuestion){const m=activeNode().messages.find(m=>m.id===btn.dataset.cancelQuestion);m.editing=false;delete m.editDraft;renderQA();return}
      if(btn.dataset.saveQuestion){const m=activeNode().messages.find(m=>m.id===btn.dataset.saveQuestion),text=m.editDraft.trim();if(!text)return;if(m.text!==text&&m.request){(m.attempts||(m.attempts=[])).push(m.request);delete m.request}m.text=links.revise(m.history||(m.history=[]),m.text,text);m.editing=false;delete m.editDraft;renderQA();return}
      if(btn.dataset.runQuestion){writeRoute(btn.dataset.runQuestion);startReply(activeNode(),activeNode().messages.find(m=>m.id===btn.dataset.runQuestion));return}
      if(btn.dataset.highlightReturn){returnToHighlight(btn.dataset.highlightReturn);return}
      if(btn.dataset.concept){const content=btn.closest('.lt-message-content');let source=null;if(content){const range=document.createRange();range.selectNodeContents(btn);source=captureSource(content,range,btn.closest('[data-message]').dataset.message)}openExample(btn.dataset.concept,source);q('h2').scrollIntoView({block:'start'});return}
      if(btn.dataset.visualize){showVisual(btn.dataset.visualize);return}
      if(btn.dataset.messageNote){const node=activeNode(),message=node.messages.find(m=>m.id===btn.dataset.messageNote);message.noteOpen=!message.noteOpen;renderQA();if(message.noteOpen)q('#lt-answer-note-'+message.id).focus();return}
      if(btn.dataset.joint){selectJoint(btn.dataset.joint);return}
      if(btn.dataset.page!==undefined){q('.lt-reading-history').close();goPage(+btn.dataset.page);return}
      if(btn.dataset.return!==undefined){backTo(+btn.dataset.return);return}
      if(btn.dataset.follow){const node=activeNode();node.replyTo=btn.dataset.follow;if(node.pendingAnchor?.messageId!==btn.dataset.follow){node.pendingAnchor=null;node.quote=''}renderQA();focusQuestion();return}
      if(btn.dataset.branchMessage){
        const node=activeNode(),message=node.messages.find(m=>m.id===btn.dataset.branchMessage),chosen=node.pendingAnchor?.messageId===message.id?node.pendingAnchor:null;
        if(!chosen&&message.nextExample){const concept=q(`#lt-message-${message.id} [data-concept="${message.nextExample}"]`);let source=null;if(concept){const range=document.createRange();range.selectNodeContents(concept);source=captureSource(concept.closest('.lt-message-content'),range,message.id)}openExample(message.nextExample,source)}
        else{const content=q(`#lt-message-${message.id} .lt-message-content`);let source=chosen;if(!source&&content){const range=document.createRange();range.selectNodeContents(content);source=captureSource(content,range,message.id)}newQuestionBranch(source?.quote||message.concept,chosen?.quote||message.concept,source)}
        q('h2').scrollIntoView({block:'start'});return;
      }
      if(btn.dataset.reopen){reopen(btn.dataset.reopen);return}
      const action=btn.dataset.action;
      if(action==='retry-route'){cloudSync.refresh().then(()=>applyRoute());return}
      if(action==='leave-route'){writeRoute(null,true);return}
      if(action==='keep-local'||action==='keep-cloud'){cloudSync.resolve(action==='keep-local'?'local':'cloud');return}
      if(action==='retry-sync'){cloudSync.refresh();return}
      if(action==='saved-copies'){savedCopies();return}
      if(action==='close-copies'){q('.lt-copies-dialog').close();return}
      if(action==='restore-study'){q('#lt-restore-file').click();return}
      if(action==='toggle-source'){showSource(!sourceOpen);return}
      if(action==='close-source'){showSource(false);q('[data-action="toggle-source"]').focus({preventScroll:true});return}
      if(action==='zoom-source'){const zoom=q('.lt-source-image').classList.toggle('lt-zoomed');btn.setAttribute('aria-pressed',String(zoom));btn.textContent=zoom?'Fit page':'Zoom in';return}
      if(action==='retry-source'){q('.lt-source-image').removeAttribute('src');showSource(true);return}
      if(action==='history'){showHistory();return}
      if(action==='close-history'){q('.lt-reading-history').close();return}
      if(action==='usage'){showUsage();return}
      if(action==='close-usage'){q('.lt-usage-dialog').close();return}
      if(action==='settings'){if(location.hash!=='#settings')history.pushState({learningSettings:true},'','#settings');showSettings();return}
      if(action==='back-settings'){leaveSettings();return}
      if(action==='reload-settings'){showSettings();return}
      if(action==='export-study'){exportStudy();return}
      if(action==='retry-save'){saveStudy();return}
      if(action==='open-wrist'){openWrist();q('h2').scrollIntoView({block:'start'});return}
      if(action==='focus-question'){focusQuestion();return}
      if(action==='clear-ask-context'){activeNode().quote='';activeNode().replyTo=null;activeNode().pendingAnchor=null;selection=null;selectedSource=null;window.getSelection()?.removeAllRanges();renderAskContext();return}
      if(action==='branch-selection'){const node=activeNode(),message=node.messages.find(m=>m.id===node.replyTo);newQuestionBranch(node.quote||message?.concept||'A related concept');return}
      if(action==='next'){if(stack.length)backTo(0);else{read.add(page);const next=book.next(page);if(next!==null)goPage(next);else{feedback='';render()}}}
      if(action==='previous'){if(stack.length)backTo(stack.length-1);else if(book.previous(page)!==null)goPage(book.previous(page))}
      if(action==='back-thread')backTo(stack.length-1);
      if(action==='context'){context=!(context||design.surrounding);design.surrounding=false;render()}
      if(action==='note'){noteOpen[page]=!noteOpen[page];q('.lt-note').hidden=!noteOpen[page];if(noteOpen[page])q('#lt-note-text').focus()}
      if(action==='highlight'){
        if(selection&&q('#lt-passage').contains(selection.commonAncestorContainer)){try{
          const before=document.createRange();before.selectNodeContents(q('#lt-passage'));before.setEnd(selection.startContainer,selection.startOffset);
          const start=before.toString().length,end=start+selection.toString().length;
          // Merge overlapping marks so repeated highlighting does not nest DOM indefinitely.
          const overlaps=highlights[page].filter(h=>h.end>=start&&h.start<=end);
          const mergedStart=Math.min(start,...overlaps.map(h=>h.start)),mergedEnd=Math.max(end,...overlaps.map(h=>h.end));
          highlights[page]=highlights[page].filter(h=>!overlaps.includes(h));highlights[page].push({start:mergedStart,end:mergedEnd,quote:clean(paragraphs[page]).slice(mergedStart,mergedEnd)});
          selection=null;window.getSelection()?.removeAllRanges();feedback='';render();
        }catch(err){feedback='Could not highlight that selection: '+err.message}}
        else feedback='Select a phrase in the paragraph first.';
        q('.lt-feedback').textContent=feedback;
      }
      if(action==='animate'){
        cancelAnimationFrame(animation);const target=joint,def=defs[target].controls[0],from=states[target][0],to=from<(def[1]+def[2])/2?def[2]:def[1];
        if(matchMedia('(prefers-reduced-motion: reduce)').matches){states[target][0]=to;buildControls();return}
        const start=performance.now();btn.textContent='Moving…';
        const frame=t=>{if(target!==joint)return;const p=Math.min((t-start)/2200,1),ease=p*p*(3-2*p);states[target][0]=Math.round(from+(to-from)*ease);q('#lt-slider-0').value=states[target][0];q('#lt-output-0').textContent=states[target][0]+def[3];draw();if(p<1)animation=requestAnimationFrame(frame);else{btn.textContent='Play one motion';saveStudy()}};
        animation=requestAnimationFrame(frame);
      }
    });
    root.addEventListener('input',e=>{
      if(e.target.dataset.wristControl!==undefined){
        const message=activeNode().messages.find(m=>m.id===e.target.dataset.visualMessage);
        message.visualization.values[+e.target.dataset.wristControl]=+e.target.value;
        e.target.closest('label').querySelector('output').textContent=e.target.value+'°';
        threadExamples.drawVisuals(q('.lt-messages'),activeNode().messages);
      }
      if(e.target.dataset.noteMessage){const message=activeNode().messages.find(m=>m.id===e.target.dataset.noteMessage);if(message.noteEditBase===undefined)message.noteEditBase=message.note||'';message.note=e.target.value;const btn=q(`[data-message-note="${message.id}"]`);btn.lastChild.textContent=message.note?' Your note':' Note'}
      if(e.target.dataset.editQuestion){const message=activeNode().messages.find(m=>m.id===e.target.dataset.editQuestion);message.editDraft=e.target.value;q(`[data-save-question="${message.id}"]`).disabled=!message.editDraft.trim()}
    });
    root.addEventListener('input',e=>{if(e.target.dataset.control!==undefined){cancelAnimationFrame(animation);q('[data-action="animate"]').textContent='Play one motion';const i=+e.target.dataset.control;states[joint][i]=+e.target.value;q('#lt-output-'+i).textContent=e.target.value+defs[joint].controls[i][3];draw()}if(e.target.id==='lt-note-text'){if(noteEdits[page]===null)noteEdits[page]=notes[page];notes[page]=e.target.value}if(e.target.id==='lt-question'){const node=activeNode();node.draft=e.target.value;q('[data-action="ask-codex"]').disabled=node.busy||!node.draft.trim()}});
    root.addEventListener('focusout',e=>{if(e.target.id==='lt-note-text'||e.target.dataset.noteMessage){flushNoteEdits();q('.lt-paragraph-history').innerHTML=historyHtml(noteHistory[page]);for(const m of activeNode().messages){const area=q(`[data-note-history="${m.id}"]`);if(area)area.innerHTML=historyHtml(m.noteHistory)}saveStudy()}});
    q('.lt-compose').addEventListener('submit',e=>{e.preventDefault();askCodex()});
    document.addEventListener('selectionchange',()=>{
      const s=window.getSelection();if(!s||!s.rangeCount||s.isCollapsed)return;
      const range=s.getRangeAt(0),container=range.commonAncestorContainer,element=container.nodeType===1?container:container.parentElement;
      if(!root.contains(element))return;
      const message=element.closest('.lt-message-content'),inPassage=q('#lt-passage').contains(container),excerpt=element.closest('.lt-thread-origin blockquote');
      if(!inPassage&&!message&&!excerpt)return;
      if(!s.toString().trim())return;
      const node=activeNode(),messageId=message?.closest('[data-message]')?.dataset.message||null;
      if(messageId&&node.messages.find(m=>m.id===messageId)?.role!=='assistant')return;
      let anchor;
      try{
        if(excerpt){if(!node.sourceAnchor)return;const a=node.sourceAnchor,relative=links.capture(excerpt,range,{});anchor=links.anchor(sourceText(a),a.start+relative.start,a.start+relative.end,{...a,id:newAnchorId()})}
        else anchor=captureSource(inPassage?q('#lt-passage'):message,range,messageId);
      }catch{return}
      if(inPassage)selection=range.cloneRange();else selection=null;
      selectedSource={quote:anchor.quote,nodeId:node.id,messageId};node.pendingAnchor=anchor;node.quote=anchor.quote;node.replyTo=messageId;renderAskContext();saveStudy();
    });
    function applyDesign(){root.classList.toggle('lt-stacked',design.layout==='Visual below');root.style.setProperty('--lt-reading-size',design.textSize+'px');render()}
    const resumed=loadStudy();
    q('.lt-view-options').insertAdjacentHTML('beforeend','<div class="lt-actions"><a class="lt-action" href="#" data-export-study download style="text-decoration:none">Export</a><button class="lt-action" type="button" data-action="restore-study">Restore</button><button class="lt-action" type="button" data-action="saved-copies">Saved copies</button></div>');
    q('.lt-view-options').insertAdjacentHTML('afterbegin','<button class="lt-action" type="button" data-action="settings">Settings</button>');
    cloudSync=LearningStudySync.create({book:LearningStudyStore.BOOK,storage:()=>window.localStorage,status:syncStatus,normalize:LearningStudyStore.upgrade,canApply:()=>studyLoaded&&!runningRequests.size&&!document.activeElement?.matches('input,textarea'),apply:saved=>{
      validateSourceLinks(saved);applyingCloud=true;
      try{studyStore.save(saved);loadStudy(saved);q('#lt-layout').value=design.layout;q('#lt-text-size').value=design.textSize;q('#lt-size-value').textContent=design.textSize+' px';q('#lt-surrounding').checked=design.surrounding;applyDesign();restoreReadingPosition();saveStudy()}
      finally{applyingCloud=false}
      if(routingReady)queueMicrotask(()=>{
        // A later cloud copy already restores its reading place. Reflect that
        // navigation without uploading our previous place over it again.
        if(!q('.lt-route-error').hidden){applyRoute(false);return}
        const route=routes.parse(location.href);
        if(route?.thread!==activeNode().id)writeRoute(null,true);
      });
      for(const node of conversations.values())for(const m of node.messages)if(m.request&&['queued','running','connecting'].includes(m.request.state))startReply(node,m);
    }});
    q('#lt-restore-file').addEventListener('change',async event=>{
      const file=event.target.files[0];if(!file)return;
      try{if(file.size>2_000_000)throw new Error('This backup exceeds 2 MB.');const backup=JSON.parse(await file.text());if(backup.book!==LearningStudyStore.BOOK)throw new Error('This backup belongs to another book.');validateSourceLinks(backup.state);await cloudSync.restore(backup.state)}
      catch(error){syncStatus({error:error.message})}finally{event.target.value=''}
    });
    q('#lt-layout').value=design.layout;q('#lt-text-size').value=design.textSize;q('#lt-size-value').textContent=design.textSize+' px';q('#lt-surrounding').checked=design.surrounding;
    applyDesign();new ResizeObserver(draw).observe(q('.lt-diagram'));
    new ResizeObserver(()=>threadExamples.drawVisuals(q('.lt-messages'),activeNode().messages)).observe(q('.lt-messages'));
    q('#lt-layout').addEventListener('change',e=>{design.layout=e.target.value;applyDesign()});
    q('#lt-text-size').addEventListener('input',e=>{design.textSize=+e.target.value;q('#lt-size-value').textContent=e.target.value+' px';applyDesign()});
    q('#lt-surrounding').addEventListener('change',e=>{design.surrounding=e.target.checked;context=false;applyDesign()});
    if(!resumed&&new URLSearchParams(location.search).get('example')==='wrist')openWrist();
    if(!resumed&&new URLSearchParams(location.search).get('example')==='highlight'){openWrist();returnToHighlight(activeNode().id)}
    restoreReadingPosition();
    if(location.hash==='#settings')showSettings();
    requestAnimationFrame(async()=>{studyReady=true;if(studyLoaded){saveStudy();await cloudSync.start(studySnapshot(),resumed);routingReady=true;applyRoute();for(const node of conversations.values())for(const m of node.messages)if(m.request&&['queued','running','connecting'].includes(m.request.state))startReply(node,m)}});
    setInterval(()=>{if(document.visibilityState==='visible')cloudSync.refresh()},15000);
    window.addEventListener('online',()=>cloudSync.refresh());
    // Save each edit synchronously after the existing action handler has run.
    for(const event of ['click','input','change','submit'])root.addEventListener(event,()=>queueMicrotask(saveStudy));
    let scrollSave=0;window.addEventListener('scroll',()=>{cancelAnimationFrame(scrollSave);scrollSave=requestAnimationFrame(saveStudy)},{passive:true});
    window.addEventListener('pagehide',()=>{flushNoteEdits();saveStudy()});
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){flushNoteEdits();saveStudy()}});
    window.addEventListener('storage',event=>{if(event.key===LearningStudyStore.KEY)saveStudy()});
  })();
  </script>
