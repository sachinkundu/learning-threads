  <script>
  (() => {
    const root=document.getElementById('lt-reading');
    const q=s=>root.querySelector(s), qa=s=>[...root.querySelectorAll(s)];
    const threadExamples=window.LearningThreadExamples;
    const links=window.LearningStudyLinks;
    const terms={R:'revolute',P:'prismatic',H:'helical',C:'cylindrical',U:'universal',S:'spherical'};
    const term=(key,name)=>`<button type="button" class="lt-term" data-joint="${key}" aria-pressed="false">${name} joint</button>`;
    const paragraphs=[
      `Figure 2.3 illustrates the basic joints found in typical robots. Every joint connects exactly two links; joints that simultaneously connect three or more links are not allowed. The ${term('R','revolute')} (R), also called a hinge joint, allows rotational motion about the joint axis. The ${term('P','prismatic')} (P), also called a sliding or linear joint, allows translational (or rectilinear) motion along the direction of the joint axis. The ${term('H','helical')} (H), also called a screw joint, allows simultaneous rotation and translation about a screw axis. Revolute, prismatic, and helical joints all have one degree of freedom.`,
      `Joints can also have multiple degrees of freedom. The ${term('C','cylindrical')} (C) has two degrees of freedom and allows independent translations and rotations about a single fixed joint axis. The ${term('U','universal')} (U) is another two-degree-of-freedom joint that consists of a pair of revolute joints arranged so that their joint axes are orthogonal. The ${term('S','spherical')} (S), also called a ball-and-socket joint, has three degrees of freedom and functions much like our shoulder joint.`
    ];
    const clean=s=>{const t=document.createElement('div');t.innerHTML=s;return t.textContent};
    const states={R:[40],P:[35],H:[90],C:[40,30],U:[25,20],S:[25,20,15]};
    const defs={
      R:{controls:[['Angle',-140,140,'°']],caption:'The moving link turns around one fixed axis.',dof:1},
      P:{controls:[['Travel',0,100,'%']],caption:'The moving link slides along one fixed axis.',dof:1},
      H:{controls:[['Turn',0,360,'°']],caption:'Turning also moves the nut along the screw. They are linked.',dof:1},
      C:{controls:[['Angle',-140,140,'°'],['Travel',0,100,'%']],caption:'Rotate and slide independently: two controls, two freedoms.',dof:2},
      U:{controls:[['First hinge',-60,60,'°'],['Second hinge',-60,60,'°']],caption:'Two hinges, with their axes at right angles.',dof:2},
      S:{controls:[['Tilt',-60,60,'°'],['Swing',-60,60,'°'],['Twist',-140,140,'°']],caption:'The link can turn about three axes through the joint.',dof:3}
    };
    let page=0,joint='R',stack=[],read=new Set(),notes=['',''],noteOpen=[false,false],highlights=[[],[]],feedback='',animation=0,context=false;
    let noteHistory=[[],[]],noteEdits=[null,null];
    let selection=null;
    let selectedSource=null,branchCount=0,messageCount=0;
    const makeNode=(id,title)=>({id,title,page,parent:null,path:[],messages:[],draft:'',quote:'',replyTo:null,status:'',busy:false,visual:null});
    const conversations=new Map([['p0',makeNode('p0','Paragraph 1')],['p1',makeNode('p1','Paragraph 2')]]);
    conversations.get('p1').page=1;
    const activeNode=()=>conversations.get(stack.length?stack.at(-1).id:'p'+page);
    const escapeText=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const newAnchorId=()=> 'a'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);

      const beam=(a,b,color)=>{path([a,b],line,23);path([a,b],color,18)};
      const degree=Math.PI/180,v=states[joint],angle=v[0]*degree;
      for(let i=-2;i<=2;i++){path([[i*.6,-1.3,-.48],[i*.6,1.3,-.48]],line,1);path([[-1.3,i*.6,-.48],[1.3,i*.6,-.48]],line,1)}
      const label=(x,y,t,anchor='start')=>el('text',{x,y,'text-anchor':anchor},t);
      if(joint==='R'){
        ring([0,0,0],[1,0,0],[0,1,0],1.25,line,1.5);
        path([[0,0,-.6],[0,0,1.2]],fixed,1.5,'4 5');
        beam([-1.35,0,0],[0,0,0],fixed);
        beam([0,0,.05],[1.5*Math.cos(angle),1.5*Math.sin(angle),.05],green);
        dot([0,0,.05],12,ink);dot([0,0,.05],5,'var(--lt-surface)');
        label(cx+9,cy-sc*1.2,'axis');
      }else if(joint==='P'){
        path([[-1.5,-.22,0],[1.5,-.22,0]],fixed,7);path([[-1.5,.22,0],[1.5,.22,0]],fixed,7);
        let x=-1+v[0]/50;beam([x,-.3,.07],[x,.3,.07],green);beam([x,0,.07],[x,0,1.05],green);
        dot([x,0,1.05],6,green);label(cx,45,'straight-line travel','middle');
      }else if(joint==='H'||joint==='C'){
        const z=joint==='H'?v[0]/360*.9:v[1]/100*.9;
        beam([0,0,-.3],[0,0,1.7],fixed);
        if(joint==='H')path(Array.from({length:200},(_,i)=>{let t=i/199*12*Math.PI;return [.18*Math.cos(t),.18*Math.sin(t),-.25+i/199*1.9]}),'var(--lt-ink)',1.8);
        ring([0,0,z],[1,0,0],[0,1,0],.33,green,14);
        beam([0,0,z],[1.4*Math.cos(angle),1.4*Math.sin(angle),z],green);
        label(cx+32,32,joint==='H'?'thread fixes the travel':'smooth shaft');
        if(joint==='H')label(cx,h-22,`${v[0]}° turn → ${(v[0]/360).toFixed(2)} of one pitch`,'middle');
      }else{
        const a=v[0]*degree,b=v[1]*degree,c=(v[2]||0)*degree;
        const rx=p=>[p[0],p[1]*Math.cos(a)-p[2]*Math.sin(a),p[1]*Math.sin(a)+p[2]*Math.cos(a)];
        const ry=p=>[p[0]*Math.cos(b)+p[2]*Math.sin(b),p[1],-p[0]*Math.sin(b)+p[2]*Math.cos(b)];
        const rz=p=>[p[0]*Math.cos(c)-p[1]*Math.sin(c),p[0]*Math.sin(c)+p[1]*Math.cos(c),p[2]];
        const rot=p=>rx(ry(rz(p)));
        beam([0,0,-.65],[0,0,0],fixed);
        if(joint==='U'){
          ring([0,0,0],[1,0,0],[0,0,1],.5,fixed,7);
          ring([0,0,0],rx([0,1,0]),rx([0,0,1]),.37,green,7);
          path([[-.65,0,0],[.65,0,0]],fixed,2,'3 4');
          path([rx([0,-.65,0]),rx([0,.65,0])],green,2,'3 4');
        }else{dot([0,0,0],28,fixed);dot([-.05,-.08,.07],20,green)}
        const end=rot([0,0,1.45]);beam([0,0,0],end,green);
        const x=rot([.36,0,1.45]),y=rot([0,.36,1.45]);path([x,end,y],ink,3);
        label(cx,h-22,joint==='U'?'two perpendicular hinges':'three rotation controls','middle');
      }
      el('circle',{cx:11,cy:19,r:4,fill:fixed});label(22,23,'Fixed link');
      el('circle',{cx:w-105,cy:19,r:4,fill:green});label(w-94,23,'Moving link');
    }
    function selectJoint(k){if(!defs[k])return;cancelAnimationFrame(animation);q('[data-action="animate"]').textContent='Play one motion';joint=k;buildControls()}
    function goPage(n){cancelAnimationFrame(animation);rememberVisual();stack=[];page=n;const saved=activeNode().visual;joint=saved?saved.joint:n===0?'R':'C';if(saved)states[joint]=[...saved.values];feedback='';selection=null;selectedSource=null;q('.lt-note').hidden=true;render();restoreReadingPosition()}
    function enter(type,title,quote=''){
      cancelAnimationFrame(animation);rememberVisual();const parent=activeNode(),id='b'+(++branchCount),label=title||(type==='freedom'?'Degrees of freedom':'Independent motion');
      const node=makeNode(id,label);node.parent=parent.id;node.page=page;node.sourceQuote=quote;conversations.set(id,node);
      stack.push({id,type,title:label,restoreJoint:joint,restoreValues:[...states[joint]]});node.path=stack.map(s=>({...s,restoreValues:[...s.restoreValues]}));
      if(type!=='custom')joint=type==='freedom'?'H':'C';selection=null;selectedSource=null;render();
    }
    function backTo(depth){cancelAnimationFrame(animation);rememberVisual();while(stack.length>depth){const saved=stack.pop();joint=saved.restoreJoint;states[joint]=[...saved.restoreValues]}selection=null;selectedSource=null;render();restoreReadingPosition()}
    function reopen(id){const node=conversations.get(id);if(!node)return;cancelAnimationFrame(animation);rememberVisual();page=node.page;stack=node.path.map(s=>({...s,restoreValues:[...s.restoreValues]}));if(node.visual){joint=node.visual.joint;states[joint]=[...node.visual.values]}selection=null;selectedSource=null;render();restoreReadingPosition()}
    root.addEventListener('click',e=>{
      const highlighted=e.target.closest('[data-source-links]');
      if(highlighted){e.preventDefault();const selected=window.getSelection();if(selected&&!selected.isCollapsed&&root.contains(selected.anchorNode))return;chooseSource(highlighted);return}
      const btn=e.target.closest('button');if(!btn)return;
      if(q('.lt-link-picker').contains(btn))q('.lt-link-picker').close();
      if(btn.dataset.openSourceThread){openSourceThread(btn.dataset.openSourceThread);return}
      if(btn.dataset.sourceReturn){returnToSource(btn.dataset.sourceReturn);return}
      if(btn.dataset.editMessage){const m=activeNode().messages.find(m=>m.id===btn.dataset.editMessage);m.editing=true;m.editDraft=m.text;renderQA();q('#lt-edit-'+m.id).focus();return}
      if(btn.dataset.cancelQuestion){const m=activeNode().messages.find(m=>m.id===btn.dataset.cancelQuestion);m.editing=false;delete m.editDraft;renderQA();return}
      if(btn.dataset.saveQuestion){const m=activeNode().messages.find(m=>m.id===btn.dataset.saveQuestion),text=m.editDraft.trim();if(!text)return;m.text=links.revise(m.history||(m.history=[]),m.text,text);m.editing=false;delete m.editDraft;renderQA();return}
      if(btn.dataset.copyMessage){copyQuestion(activeNode(),activeNode().messages.find(m=>m.id===btn.dataset.copyMessage));return}
      if(btn.dataset.highlightReturn){returnToHighlight(btn.dataset.highlightReturn);return}
      if(btn.dataset.concept){const content=btn.closest('.lt-message-content');let source=null;if(content){const range=document.createRange();range.selectNodeContents(btn);source=captureSource(content,range,btn.closest('[data-message]').dataset.message)}openExample(btn.dataset.concept,source);q('h2').scrollIntoView({block:'start'});return}
      if(btn.dataset.visualize){showVisual(btn.dataset.visualize);return}
      if(btn.dataset.messageNote){const node=activeNode(),message=node.messages.find(m=>m.id===btn.dataset.messageNote);message.noteOpen=!message.noteOpen;renderQA();if(message.noteOpen)q('#lt-answer-note-'+message.id).focus();return}
      if(btn.dataset.joint){selectJoint(btn.dataset.joint);return}
      if(btn.dataset.page!==undefined){goPage(+btn.dataset.page);return}
      if(btn.dataset.return!==undefined){backTo(+btn.dataset.return);return}
      if(btn.dataset.follow){const node=activeNode();node.replyTo=btn.dataset.follow;if(node.pendingAnchor?.messageId!==btn.dataset.follow){node.pendingAnchor=null;node.quote=''}renderQA();focusQuestion();return}
      if(btn.dataset.branchMessage){
        const node=activeNode(),message=node.messages.find(m=>m.id===btn.dataset.branchMessage),chosen=node.pendingAnchor?.messageId===message.id?node.pendingAnchor:null;
        if(!chosen&&message.nextExample){const concept=q(`#lt-message-${message.id} [data-concept="${message.nextExample}"]`);let source=null;if(concept){const range=document.createRange();range.selectNodeContents(concept);source=captureSource(concept.closest('.lt-message-content'),range,message.id)}openExample(message.nextExample,source)}
        else{const content=q(`#lt-message-${message.id} .lt-message-content`);let source=chosen;if(!source&&content){const range=document.createRange();range.selectNodeContents(content);source=captureSource(content,range,message.id)}newQuestionBranch(source?.quote||message.concept,chosen?.quote||message.concept,source)}
        q('h2').scrollIntoView({block:'start'});return;
      }
      if(btn.dataset.reopen){reopen(btn.dataset.reopen);return}
      const action=btn.dataset.action;
      if(action==='export-study'){exportStudy();return}
      if(action==='retry-save'){saveStudy();return}
      if(action==='open-wrist'){openWrist();q('h2').scrollIntoView({block:'start'});return}
      if(action==='focus-question'){focusQuestion();return}
      if(action==='clear-ask-context'){activeNode().quote='';activeNode().replyTo=null;activeNode().pendingAnchor=null;selection=null;selectedSource=null;window.getSelection()?.removeAllRanges();renderAskContext();return}
      if(action==='branch-selection'){const node=activeNode(),message=node.messages.find(m=>m.id===node.replyTo);newQuestionBranch(node.quote||message?.concept||'A related concept');return}
      if(action==='next'){if(stack.length)backTo(0);else{read.add(page);if(page===0)goPage(1);else{feedback='';render()}}}
      if(action==='previous'){if(stack.length)backTo(stack.length-1);else if(page>0)goPage(page-1)}
      if(action==='back-thread')backTo(stack.length-1);
      if(action==='context'){context=!(context||design.surrounding);design.surrounding=false;render()}
      if(action==='note'){noteOpen[page]=!noteOpen[page];q('.lt-note').hidden=!noteOpen[page];if(noteOpen[page])q('#lt-note-text').focus()}
      if(action==='highlight'){
        if(selection&&q('#lt-passage').contains(selection.commonAncestorContainer)){try{
          const before=document.createRange();before.selectNodeContents(q('#lt-passage'));before.setEnd(selection.startContainer,selection.startOffset);
          const start=before.toString().length,end=start+selection.toString().length;
          // Merge overlapping marks so repeated highlighting does not nest DOM indefinitely.
          const overlaps=highlights[page].filter(h=>h.end>=start&&h.start<=end);
          const mergedStart=Math.min(start,...overlaps.map(h=>h.start)),mergedEnd=Math.max(end,...overlaps.map(h=>h.end));
          highlights[page]=highlights[page].filter(h=>!overlaps.includes(h));highlights[page].push({start:mergedStart,end:mergedEnd,quote:clean(paragraphs[page]).slice(mergedStart,mergedEnd)});
          selection=null;window.getSelection()?.removeAllRanges();feedback='';render();
        }catch(err){feedback='Could not highlight that selection: '+err.message}}
        else feedback='Select a phrase in the paragraph first.';
        q('.lt-feedback').textContent=feedback;
      }
      if(action==='animate'){
        cancelAnimationFrame(animation);const target=joint,def=defs[target].controls[0],from=states[target][0],to=from<(def[1]+def[2])/2?def[2]:def[1];
        if(matchMedia('(prefers-reduced-motion: reduce)').matches){states[target][0]=to;buildControls();return}
        const start=performance.now();btn.textContent='Moving…';
        const frame=t=>{if(target!==joint)return;const p=Math.min((t-start)/2200,1),ease=p*p*(3-2*p);states[target][0]=Math.round(from+(to-from)*ease);q('#lt-slider-0').value=states[target][0];q('#lt-output-0').textContent=states[target][0]+def[3];draw();if(p<1)animation=requestAnimationFrame(frame);else{btn.textContent='Play one motion';saveStudy()}};
        animation=requestAnimationFrame(frame);
      }
    });
    root.addEventListener('input',e=>{
      if(e.target.dataset.wristControl!==undefined){
        const message=activeNode().messages.find(m=>m.id===e.target.dataset.visualMessage);
        message.visualization.values[+e.target.dataset.wristControl]=+e.target.value;
        e.target.closest('label').querySelector('output').textContent=e.target.value+'°';
        threadExamples.drawVisuals(q('.lt-messages'),activeNode().messages);
      }
      if(e.target.dataset.noteMessage){const message=activeNode().messages.find(m=>m.id===e.target.dataset.noteMessage);if(message.noteEditBase===undefined)message.noteEditBase=message.note||'';message.note=e.target.value;const btn=q(`[data-message-note="${message.id}"]`);btn.lastChild.textContent=message.note?' Your note':' Note'}
      if(e.target.dataset.editQuestion){const message=activeNode().messages.find(m=>m.id===e.target.dataset.editQuestion);message.editDraft=e.target.value;q(`[data-save-question="${message.id}"]`).disabled=!message.editDraft.trim()}
    });
    root.addEventListener('input',e=>{if(e.target.dataset.control!==undefined){cancelAnimationFrame(animation);q('[data-action="animate"]').textContent='Play one motion';const i=+e.target.dataset.control;states[joint][i]=+e.target.value;q('#lt-output-'+i).textContent=e.target.value+defs[joint].controls[i][3];draw()}if(e.target.id==='lt-note-text'){if(noteEdits[page]===null)noteEdits[page]=notes[page];notes[page]=e.target.value}if(e.target.id==='lt-question'){const node=activeNode();node.draft=e.target.value;q('[data-action="ask-codex"]').disabled=node.busy||!node.draft.trim()}});
    root.addEventListener('focusout',e=>{if(e.target.id==='lt-note-text'||e.target.dataset.noteMessage){flushNoteEdits();q('.lt-paragraph-history').innerHTML=historyHtml(noteHistory[page]);for(const m of activeNode().messages){const area=q(`[data-note-history="${m.id}"]`);if(area)area.innerHTML=historyHtml(m.noteHistory)}saveStudy()}});
    q('.lt-compose').addEventListener('submit',e=>{e.preventDefault();askCodex()});
    document.addEventListener('selectionchange',()=>{
      const s=window.getSelection();if(!s||!s.rangeCount||s.isCollapsed)return;
      const range=s.getRangeAt(0),container=range.commonAncestorContainer,element=container.nodeType===1?container:container.parentElement;
      if(!root.contains(element))return;
      const message=element.closest('.lt-message-content'),inPassage=q('#lt-passage').contains(container),excerpt=element.closest('.lt-thread-origin blockquote');
      if(!inPassage&&!message&&!excerpt)return;
      if(!s.toString().trim())return;
      const node=activeNode(),messageId=message?.closest('[data-message]')?.dataset.message||null;
      if(messageId&&node.messages.find(m=>m.id===messageId)?.role!=='assistant')return;
      let anchor;
      try{
        if(excerpt){if(!node.sourceAnchor)return;const a=node.sourceAnchor,relative=links.capture(excerpt,range,{});anchor=links.anchor(sourceText(a),a.start+relative.start,a.start+relative.end,{...a,id:newAnchorId()})}
        else anchor=captureSource(inPassage?q('#lt-passage'):message,range,messageId);
      }catch{return}
      if(inPassage)selection=range.cloneRange();else selection=null;
      selectedSource={quote:anchor.quote,nodeId:node.id,messageId};node.pendingAnchor=anchor;node.quote=anchor.quote;node.replyTo=messageId;renderAskContext();saveStudy();
    });
    function applyDesign(){root.classList.toggle('lt-stacked',design.layout==='Visual below');root.style.setProperty('--lt-reading-size',design.textSize+'px');render()}
    const resumed=loadStudy();
    q('#lt-layout').value=design.layout;q('#lt-text-size').value=design.textSize;q('#lt-size-value').textContent=design.textSize+' px';q('#lt-surrounding').checked=design.surrounding;
    applyDesign();new ResizeObserver(draw).observe(q('.lt-diagram'));
    new ResizeObserver(()=>threadExamples.drawVisuals(q('.lt-messages'),activeNode().messages)).observe(q('.lt-messages'));
    q('#lt-layout').addEventListener('change',e=>{design.layout=e.target.value;applyDesign()});
    q('#lt-text-size').addEventListener('input',e=>{design.textSize=+e.target.value;q('#lt-size-value').textContent=e.target.value+' px';applyDesign()});
    q('#lt-surrounding').addEventListener('change',e=>{design.surrounding=e.target.checked;context=false;applyDesign()});
    if(!resumed&&new URLSearchParams(location.search).get('example')==='wrist')openWrist();
    if(!resumed&&new URLSearchParams(location.search).get('example')==='highlight'){openWrist();returnToHighlight(activeNode().id)}
    restoreReadingPosition();
    requestAnimationFrame(()=>{studyReady=true;if(studyLoaded)saveStudy()});
    // Save each edit synchronously after the existing action handler has run.
    for(const event of ['click','input','change','submit'])root.addEventListener(event,()=>queueMicrotask(saveStudy));
    let scrollSave=0;window.addEventListener('scroll',()=>{cancelAnimationFrame(scrollSave);scrollSave=requestAnimationFrame(saveStudy)},{passive:true});
    window.addEventListener('pagehide',()=>{flushNoteEdits();saveStudy()});
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){flushNoteEdits();saveStudy()}});
    window.addEventListener('storage',event=>{if(event.key===LearningStudyStore.KEY)saveStudy()});
  })();
  </script>
