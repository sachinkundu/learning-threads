  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

  (() =&gt; {

    const paragraphs=[
      `Figure 2.3 illustrates the basic joints found in typical robots. Every joint connects exactly two links; joints that simultaneously connect three or more links are not allowed. The ${term(&#x27;R&#x27;,&#x27;revolute&#x27;)} (R), also called a hinge joint, allows rotational motion about the joint axis. The ${term(&#x27;P&#x27;,&#x27;prismatic&#x27;)} (P), also called a sliding or linear joint, allows translational (or rectilinear) motion along the direction of the joint axis. The ${term(&#x27;H&#x27;,&#x27;helical&#x27;)} (H), also called a screw joint, allows simultaneous rotation and translation about a screw axis. Revolute, prismatic, and helical joints all have one degree of freedom.`,
      `Joints can also have multiple degrees of freedom. The ${term(&#x27;C&#x27;,&#x27;cylindrical&#x27;)} (C) has two degrees of freedom and allows independent translations and rotations about a single fixed joint axis. The ${term(&#x27;U&#x27;,&#x27;universal&#x27;)} (U) is another two-degree-of-freedom joint that consists of a pair of revolute joints arranged so that their joint axes are orthogonal. The ${term(&#x27;S&#x27;,&#x27;spherical&#x27;)} (S), also called a ball-and-socket joint, has three degrees of freedom and functions much like our shoulder joint.`
    ];
    const clean=s=&gt;{const t=document.createElement(&#x27;div&#x27;);t.innerHTML=s;return t.textContent};
    const states={R:[40],P:[35],H:[90],C:[40,30],U:[25,20],S:[25,20,15]};
    const defs={
      R:{controls:[[&#x27;Angle&#x27;,-140,140,&#x27;°&#x27;]],caption:&#x27;The moving link turns around one fixed axis.&#x27;,dof:1},
      P:{controls:[[&#x27;Travel&#x27;,0,100,&#x27;%&#x27;]],caption:&#x27;The moving link slides along one fixed axis.&#x27;,dof:1},
      H:{controls:[[&#x27;Turn&#x27;,0,360,&#x27;°&#x27;]],caption:&#x27;Turning also moves the nut along the screw. They are linked.&#x27;,dof:1},
      C:{controls:[[&#x27;Angle&#x27;,-140,140,&#x27;°&#x27;],[&#x27;Travel&#x27;,0,100,&#x27;%&#x27;]],caption:&#x27;Rotate and slide independently: two controls, two freedoms.&#x27;,dof:2},
      U:{controls:[[&#x27;First hinge&#x27;,-60,60,&#x27;°&#x27;],[&#x27;Second hinge&#x27;,-60,60,&#x27;°&#x27;]],caption:&#x27;Two hinges, with their axes at right angles.&#x27;,dof:2},
      S:{controls:[[&#x27;Tilt&#x27;,-60,60,&#x27;°&#x27;],[&#x27;Swing&#x27;,-60,60,&#x27;°&#x27;],[&#x27;Twist&#x27;,-140,140,&#x27;°&#x27;]],caption:&#x27;The link can turn about three axes through the joint.&#x27;,dof:3}
    };
    let page=0,joint=&#x27;R&#x27;,stack=[],read=new Set(),notes=[&#x27;&#x27;,&#x27;&#x27;],savedHtml=[null,null],feedback=&#x27;&#x27;,animation=0,context=false;
    let selection=null;
    let selectedSource=null,branchCount=0,messageCount=0;
    const makeNode=(id,title)=&gt;({id,title,page,parent:null,path:[],messages:[],draft:&#x27;&#x27;,quote:&#x27;&#x27;,replyTo:null,status:&#x27;&#x27;,busy:false,visual:null});
    const conversations=new Map([[&#x27;p0&#x27;,makeNode(&#x27;p0&#x27;,&#x27;Paragraph 1&#x27;)],[&#x27;p1&#x27;,makeNode(&#x27;p1&#x27;,&#x27;Paragraph 2&#x27;)]]);
    conversations.get(&#x27;p1&#x27;).page=1;
    const activeNode=()=&gt;conversations.get(stack.length?stack.at(-1).id:&#x27;p&#x27;+page);
    const escapeText=value=&gt;String(value??&#x27;&#x27;).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g,char=&gt;({&#x27;&amp;&#x27;:&#x27;&amp;amp;&#x27;,&#x27;&lt;&#x27;:&#x27;&amp;lt;&#x27;,&#x27;&gt;&#x27;:&#x27;&amp;gt;&#x27;,&#x27;&quot;&#x27;:&#x27;&amp;quot;&#x27;,&quot;&#x27;&quot;:&#x27;&amp;#39;&#x27;}[char]));
    function rememberVisual(){activeNode().visual={joint,values:[...states[joint]]};activeNode().scrollY=window.scrollY}
    function restoreReadingPosition(){const y=activeNode().scrollY||0;requestAnimationFrame(()=&gt;window.scrollTo(0,y))}
    function renderAskContext(){
      const node=activeNode(),box=q(&#x27;.lt-ask-context&#x27;);
      const message=node.replyTo?node.messages.find(m=&gt;m.id===node.replyTo):null;
      box.hidden=!node.quote&amp;&amp;!message;
      box.innerHTML=(node.quote?`&lt;span&gt;Selected text&lt;/span&gt;&lt;blockquote&gt;${escapeText(node.quote)}&lt;/blockquote&gt;`:message?&#x27;&lt;span&gt;Following up on the selected reply&lt;/span&gt;&#x27;:&#x27;&#x27;)+`&lt;div class=&quot;lt-context-actions&quot;&gt;&lt;button type=&quot;button&quot; data-action=&quot;clear-ask-context&quot;&gt;Clear selection&lt;/button&gt;&lt;button type=&quot;button&quot; data-action=&quot;branch-selection&quot;&gt;Explore separately &lt;span aria-hidden=&quot;true&quot;&gt;↗&lt;/span&gt;&lt;/button&gt;&lt;/div&gt;`;
    }
    function renderQA(){
      const node=activeNode();
      q(&#x27;.lt-compose label&#x27;).textContent=node.messages.length?&#x27;Ask a follow-up&#x27;:stack.length?&#x27;Ask about &#x27;+node.title.toLowerCase():&#x27;Ask about this paragraph&#x27;;
      q(&#x27;.lt-messages&#x27;).innerHTML=node.messages.map(renderMessage).join(&#x27;&#x27;);
      q(&#x27;#lt-question&#x27;).value=node.draft;
      q(&#x27;[data-action=&quot;ask-codex&quot;]&#x27;).disabled=node.busy||!node.draft.trim();
      q(&#x27;.lt-qa-status&#x27;).textContent=node.status;
      const children=[...conversations.values()].filter(n=&gt;n.parent&amp;&amp;n.page===page);
      q(&#x27;.lt-branches&#x27;).hidden=!children.length||!!stack.length;
      q(&#x27;.lt-branch-list&#x27;).innerHTML=children.map(n=&gt;`&lt;button type=&quot;button&quot; data-reopen=&quot;${n.id}&quot; style=&quot;padding-left:${8+Math.min(n.path.length-1,4)*14}px&quot;&gt;&lt;i data-lucide=&quot;git-branch&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;${escapeText(n.title)}${n.id===node.id?&#x27; · here&#x27;:&#x27;&#x27;}&lt;/button&gt;`).join(&#x27;&#x27;);
      renderAskContext();icons();threadExamples.drawVisuals(q(&#x27;.lt-messages&#x27;),node.messages);
    }
    function renderMessage(m){
      const example=m.example?threadExamples.examples[m.example]:null;
      const label=m.role===&#x27;user&#x27;?&#x27;You&#x27;:&#x27;Assistant&#x27;;
      const content=example?example.html():escapeText(m.text);
      const hasVisual=activeNode().messages.some(other=&gt;other.visualization?.sourceMessage===m.id);
      return `&lt;article class=&quot;lt-message ${m.role===&#x27;user&#x27;?&#x27;lt-user&#x27;:&#x27;&#x27;} ${m.visualization?&#x27;lt-visual-message&#x27;:&#x27;&#x27;}&quot; data-message=&quot;${m.id}&quot; id=&quot;lt-message-${m.id}&quot;&gt;
        &lt;div class=&quot;lt-message-meta&quot;&gt;&lt;span&gt;${label}&lt;/span&gt;&lt;/div&gt;
        ${m.quote?`&lt;div class=&quot;lt-message-quote&quot;&gt;${escapeText(m.quote)}&lt;/div&gt;`:&#x27;&#x27;}
        ${m.visualization?&#x27;&#x27;:`&lt;div class=&quot;lt-message-content ${example?&#x27;lt-rich&#x27;:&#x27;&#x27;}&quot;&gt;${content}&lt;/div&gt;`}
        ${m.visualization?threadExamples.visualHtml(m):&#x27;&#x27;}
        ${m.role===&#x27;assistant&#x27;?`&lt;div class=&quot;lt-actions&quot;&gt;
          ${m.visualKey?`&lt;button class=&quot;lt-action&quot; type=&quot;button&quot; data-visualize=&quot;${m.id}&quot;&gt;&lt;i data-lucide=&quot;shapes&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;${hasVisual?&#x27;View visual&#x27;:&#x27;Visualize&#x27;}&lt;/button&gt;`:&#x27;&#x27;}
          &lt;button class=&quot;lt-action&quot; type=&quot;button&quot; data-follow=&quot;${m.id}&quot;&gt;Ask follow-up&lt;/button&gt;
          &lt;button class=&quot;lt-action&quot; type=&quot;button&quot; data-branch-message=&quot;${m.id}&quot;&gt;&lt;i data-lucide=&quot;git-branch&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt; Explore separately&lt;/button&gt;
          &lt;button class=&quot;lt-action&quot; type=&quot;button&quot; data-message-note=&quot;${m.id}&quot; aria-expanded=&quot;${!!m.noteOpen}&quot;&gt;&lt;i data-lucide=&quot;pencil-line&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;${m.note?&#x27;Your note&#x27;:&#x27;Note&#x27;}&lt;/button&gt;
        &lt;/div&gt;&lt;div class=&quot;lt-message-note&quot; ${m.noteOpen?&#x27;&#x27;:&#x27;hidden&#x27;}&gt;&lt;label for=&quot;lt-answer-note-${m.id}&quot;&gt;Your note on this answer&lt;/label&gt;&lt;textarea id=&quot;lt-answer-note-${m.id}&quot; data-note-message=&quot;${m.id}&quot;&gt;${escapeText(m.note||&#x27;&#x27;)}&lt;/textarea&gt;&lt;/div&gt;`:&#x27;&#x27;}
      &lt;/article&gt;`;
    }
    function openExample(key){
      const example=threadExamples.examples[key];if(!example)return;
      const parent=activeNode();
      const existing=[...conversations.values()].find(n=&gt;n.parent===parent.id&amp;&amp;n.example===key);
      if(existing){reopen(existing.id);return}

      if(key===&#x27;wrist&#x27;)node.sourceAnchor=makeBookAnchor(example.quote,node.id);
      node.messages.push({id:&#x27;m&#x27;+(++messageCount),role:&#x27;user&#x27;,text:example.question,sourceAnchor:node.sourceAnchor||null});
      node.messages.push({id:&#x27;m&#x27;+(++messageCount),role:&#x27;assistant&#x27;,kind:example.kind,text:example.text,example:key,visualKey:example.visual,concept:example.concept,nextExample:example.next});
      render();
    }
    function makeBookAnchor(quote,threadId){
      const text=clean(paragraphs[page]),start=text.indexOf(quote);
      if(start&lt;0||text.indexOf(quote,start+1)!==-1)throw new Error(&#x27;The highlighted source must match one exact passage.&#x27;);
      return {id:&#x27;highlight-&#x27;+threadId,book:&#x27;modern-robotics-2019-preprint&#x27;,paragraph:&#x27;2.2.1-p&#x27;+(page+1),page,sourcePage:16,start,end:start+quote.length,quote,prefix:text.slice(Math.max(0,start-40),start),suffix:text.slice(start+quote.length,start+quote.length+40)};
    }
    function renderBookAnchors(){
      const passage=q(&#x27;#lt-passage&#x27;);
      passage.querySelectorAll(&#x27;[data-book-anchor]&#x27;).forEach(link=&gt;link.replaceWith(document.createTextNode(link.textContent)));
      const anchored=[...conversations.values()].filter(n=&gt;n.sourceAnchor?.page===page).sort((a,b)=&gt;b.sourceAnchor.start-a.sourceAnchor.start);
      for(const node of anchored){
        const anchor=node.sourceAnchor,walker=document.createTreeWalker(passage,NodeFilter.SHOW_TEXT),segments=[];
        let part,offset=0;while((part=walker.nextNode())){segments.push({node:part,start:offset,end:offset+part.length});offset+=part.length}
        const first=segments.find(s=&gt;s.start&lt;=anchor.start&amp;&amp;s.end&gt;anchor.start),last=segments.find(s=&gt;s.start&lt;anchor.end&amp;&amp;s.end&gt;=anchor.end);
        if(!first||!last)continue;
        const range=document.createRange();range.setStart(first.node,anchor.start-first.start);range.setEnd(last.node,anchor.end-last.start);
        if(range.toString()!==anchor.quote)continue;

        const link=document.createElement(&#x27;a&#x27;);link.href=&#x27;#&#x27;+anchor.id;link.className=&#x27;lt-highlight-origin&#x27;;link.dataset.highlightThread=node.id;link.dataset.bookAnchor=anchor.id;
        link.setAttribute(&#x27;aria-label&#x27;,&#x27;Highlighted passage: &#x27;+anchor.quote+&#x27; Open discussion: &#x27;+node.title);
        const mark=document.createElement(&#x27;mark&#x27;);mark.textContent=anchor.quote;link.append(mark);range.insertNode(link);
      }
      const wrist=anchored.find(n=&gt;n.example===&#x27;wrist&#x27;),button=q(&#x27;[data-action=&quot;open-wrist&quot;]&#x27;);
      if(wrist){button.innerHTML=&#x27;&lt;i data-lucide=&quot;git-branch&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt; 1 linked discussion &lt;span&gt;· Why three wrist joints?&lt;/span&gt;&#x27;;button.setAttribute(&#x27;aria-label&#x27;,&#x27;Open discussion linked to the spherical-joint highlight&#x27;)}
      else{button.innerHTML=&#x27;&lt;i data-lucide=&quot;git-branch&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt; Wrist discussion&#x27;;button.removeAttribute(&#x27;aria-label&#x27;)}
    }
    function returnToHighlight(threadId){
      const node=conversations.get(threadId);if(!node?.sourceAnchor)return;
      const anchor=node.sourceAnchor;goPage(anchor.page);
      requestAnimationFrame(()=&gt;{const link=q(`[data-book-anchor=&quot;${anchor.id}&quot;]`);if(link){link.scrollIntoView({block:&#x27;center&#x27;});link.focus({preventScroll:true});feedback=&#x27;&#x27;;q(&#x27;.lt-feedback&#x27;).textContent=&#x27;&#x27;}});
    }
    function openWrist(){

    function showVisual(id){
      const node=activeNode(),answer=node.messages.find(m=&gt;m.id===id);if(!answer?.visualKey)return;

  const skipDelay = 300;
