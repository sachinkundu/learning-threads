<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-gnXe6OFhtpWvbESQp3u4EeyxSXOWwVVCLm0zCZqDido=' 'sha256-4TFP5FpcUwA4OMszIgqVd//jb03wLRqBi9C2UorMYig=' 'sha256-wBoyCocLc65iovx+XTUWOsMvdcMnsgpmw2aKh3BNd+k=' 'sha256-iy3oGYqYDroIKXbv0+MzsOpdHgV83VMN0GV1ikcRDo0=' 'sha256-qUxhQtC74E/sNhzjXwCm+lcdoi9X2e4mg+hozKWJoaA=' 'sha256-VzcDk7H6pc1fqd8eRAbmSvxb7LKOAGVyheLAtX7cGfU=' 'sha256-4Fm8SxK0kNUll+g7+jQziuWRFbeAVeR3qqcDUtdTihs=' https://unpkg.com/lucide@1.17.0/; style-src 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
<title>Learning Threads</title>
<style>html,body{margin:0;padding:0}svg.lucide{width:16px;height:16px;flex-shrink:0;vertical-align:middle}</style>
</head>
<body><div id="lt-reading" aria-label="Learning Threads reading experiment">
  <style>
    #lt-reading{--lt-bg:light-dark(#faf9f5,#171e20);--lt-surface:light-dark(#ffffff,#20292b);--lt-ink:light-dark(#203431,#edf3ee);--lt-muted:light-dark(#63736e,#a9bbb4);--lt-line:light-dark(#e1e7df,#354641);--lt-green:light-dark(#1d6758,#95d7be);--lt-soft:light-dark(#e9f1e8,#293f37);--lt-teal:light-dark(#398878,#79c3ab);--lt-fixed:light-dark(#94a69f,#6d8b80);--lt-paper:light-dark(#f0f3ed,#1c3028);--lt-mark:light-dark(#fcf1b8,#625721);color:var(--lt-ink);background:var(--lt-bg);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;border:1px solid var(--lt-line);border-radius:16px;overflow:hidden}
    #lt-reading *{box-sizing:border-box}
    #lt-reading button,#lt-reading input,#lt-reading textarea{font:inherit}
    #lt-reading button{cursor:pointer;touch-action:manipulation;color:inherit}
    #lt-reading button:disabled{opacity:.4;cursor:default}
    #lt-reading button:focus-visible,#lt-reading input:focus-visible,#lt-reading textarea:focus-visible{outline:3px solid var(--lt-teal);outline-offset:3px}
    #lt-reading [hidden]{display:none!important}
    #lt-reading .lt-top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 26px;background:var(--lt-surface);border-bottom:1px solid var(--lt-line)}
    #lt-reading .lt-brand{font-weight:650;letter-spacing:-.4px;display:flex;align-items:center;gap:10px;font-size:17px}
    #lt-reading .lt-brand i{color:var(--lt-green)}
    
    #lt-reading .lt-content{padding:28px 32px 22px}
    #lt-reading .lt-bookline{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;color:var(--lt-muted);font-size:13px;margin-bottom:22px}
    #lt-reading .lt-bookline strong{font-weight:550;color:var(--lt-ink)}
    
    
    
    #lt-reading h2{font:500 32px/1.15 Georgia,"Times New Roman",serif;letter-spacing:-.7px;margin:0 0 25px}
    #lt-reading .lt-columns{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);gap:34px;align-items:start}
    #lt-reading .lt-sectionlabel{font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--lt-muted);font-weight:600;margin-bottom:14px}
    #lt-reading .lt-prose{font:400 var(--lt-reading-size,19px)/1.75 Georgia,"Times New Roman",serif;margin:0;color:var(--lt-ink)}
    #lt-reading .lt-term{font:inherit!important;border:0;border-bottom:1px solid var(--lt-green);padding:0 2px;background:transparent;color:var(--lt-green);border-radius:3px;text-align:left;display:inline}
    #lt-reading .lt-term[aria-pressed="true"]{background:var(--lt-soft);border-bottom:2px solid var(--lt-green)}
    #lt-reading .lt-source{font-size:12px;color:var(--lt-muted);margin-top:18px}
    #lt-reading .lt-book-meta{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
    #lt-reading .lt-source-page{grid-column:2;grid-row:1 / span 2;position:sticky;top:24px;min-width:0;border:1px solid var(--lt-line);border-radius:10px;overflow:hidden;background:var(--lt-surface)}
    #lt-reading .lt-source-tools{display:flex;justify-content:flex-end;gap:10px;padding:8px 12px}
    #lt-reading .lt-source-viewport{overflow:auto;max-height:calc(100dvh - 110px);overscroll-behavior:contain;background:#e9e9e6}
    #lt-reading .lt-source-image{display:block;width:100%;height:auto;max-width:none;background:#fff}
    #lt-reading .lt-source-image.lt-zoomed{width:200%}
    #lt-reading .lt-source-error{padding:16px;margin:0}
    #lt-reading.lt-stacked .lt-source-page{grid-column:1;grid-row:2;position:static;margin-top:25px}
    #lt-reading.lt-in-thread.lt-source-open .lt-content{max-width:1440px}
    #lt-reading.lt-in-thread.lt-source-open .lt-columns{grid-template-columns:minmax(0,1.12fr) minmax(0,1fr);column-gap:44px}
    #lt-reading.lt-in-thread.lt-source-open.lt-stacked .lt-columns{grid-template-columns:1fr}
    #lt-reading.lt-in-thread.lt-source-open.lt-stacked .lt-qa{grid-row:3}
    @media(max-width:860px){#lt-reading .lt-source-page{grid-column:1;grid-row:2;position:static;margin-top:24px}}
    @media(max-width:860px){#lt-reading.lt-in-thread.lt-source-open .lt-columns{grid-template-columns:1fr}#lt-reading.lt-in-thread.lt-source-open .lt-qa{grid-row:3}}
    #lt-reading .lt-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
    #lt-reading .lt-action{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--lt-line);border-radius:8px;background:var(--lt-surface);padding:9px 12px;min-height:42px;font-size:13px}
    #lt-reading .lt-action.lt-primary{background:var(--lt-green);color:var(--lt-bg);border-color:var(--lt-green)}
    #lt-reading .lt-quiet{background:none;border:0;font-size:13px;padding:8px 0;color:var(--lt-muted)}
    #lt-reading .lt-demo{background:var(--lt-paper);border-radius:12px;padding:19px 18px 17px}
    #lt-reading .lt-demotop{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin-bottom:14px}
    #lt-reading .lt-demotop strong{font-size:14px;font-weight:600}
    #lt-reading .lt-demotop span{font-size:11px;color:var(--lt-muted)}
    #lt-reading .lt-joints{display:flex;gap:3px;flex-wrap:wrap;background:var(--lt-surface);padding:4px;border-radius:8px}
    #lt-reading .lt-joints button{flex:1;border:0;padding:8px 7px;border-radius:5px;background:transparent;font-size:12px;min-height:38px}
    #lt-reading .lt-joints button[aria-pressed="true"]{background:var(--lt-green);color:var(--lt-bg)}
    #lt-reading .lt-diagram{display:block;width:100%;height:270px;overflow:visible}
    #lt-reading .lt-diagram text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--lt-muted);font-size:11px}
    #lt-reading .lt-caption{font-size:14px;line-height:1.5;text-align:center;min-height:43px;margin:0 0 16px;color:var(--lt-ink)}
    #lt-reading .lt-control{margin-top:12px}
    #lt-reading .lt-control label{display:flex;justify-content:space-between;font-size:12px;gap:8px}
    #lt-reading output{font-variant-numeric:tabular-nums;color:var(--lt-green);font-weight:600}
    #lt-reading input[type="range"]{width:100%;accent-color:var(--lt-green);height:26px;cursor:ew-resize;margin:3px 0 0}
    #lt-reading .lt-demofoot{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:14px;font-size:12px;color:var(--lt-muted)}
    #lt-reading .lt-demofoot button{border:0;background:var(--lt-surface);border-radius:6px;padding:7px 10px;font-size:12px;min-height:38px}
    #lt-reading .lt-footer{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-top:28px;padding-top:19px;border-top:1px solid var(--lt-line)}
    #lt-reading .lt-progress{display:flex;align-items:center;gap:8px;color:var(--lt-muted);font-size:12px}
    #lt-reading .lt-progress button{width:32px;height:32px;border-radius:50%;border:1px solid var(--lt-line);background:var(--lt-surface);font-size:12px}
    #lt-reading .lt-progress button.current{background:var(--lt-green);color:var(--lt-bg);border-color:var(--lt-green)}
    #lt-reading .lt-nav{display:flex;gap:10px}
    #lt-reading .lt-context{margin-top:22px;border-top:1px solid var(--lt-line);padding-top:16px;color:var(--lt-muted);font:16px/1.7 Georgia,serif}
    #lt-reading .lt-context .lt-sectionlabel{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    #lt-reading .lt-thread{background:var(--lt-surface);border-left:3px solid var(--lt-green);padding:19px 21px;border-radius:0 10px 10px 0}
    #lt-reading .lt-thread h3{font:500 23px/1.3 Georgia,serif;margin:0 0 15px}
    #lt-reading .lt-thread p{font:17px/1.7 Georgia,serif;margin:0 0 15px}
    #lt-reading .lt-thread .lt-sectionlabel{margin-bottom:15px}
    #lt-reading .lt-thread small{font-size:12px;color:var(--lt-muted)}
    #lt-reading .lt-note{margin-top:18px;background:var(--lt-surface);border:1px solid var(--lt-line);border-radius:8px;padding:13px}
    #lt-reading .lt-note label{font-size:12px;color:var(--lt-muted);display:block;margin-bottom:7px}
    #lt-reading .lt-note textarea{width:100%;resize:vertical;min-height:80px;background:var(--lt-bg);color:var(--lt-ink);border:1px solid var(--lt-line);border-radius:5px;padding:9px;font-size:16px}
    #lt-reading .lt-note small{display:block;color:var(--lt-muted);font-size:11px;margin-top:5px}
    #lt-reading mark{background:var(--lt-mark);color:inherit;border-radius:3px}
    #lt-reading .lt-feedback{font-size:12px;color:var(--lt-muted);min-height:18px;margin-top:8px}
    #lt-reading .lt-qa{margin-top:23px;padding-top:19px;border-top:1px solid var(--lt-line)}
    
    
    #lt-reading .lt-messages{display:grid;gap:15px;margin-bottom:16px}
    #lt-reading .lt-message{min-width:0;padding:15px 17px;border-radius:10px;background:var(--lt-surface);overflow-wrap:anywhere}
    #lt-reading .lt-message.lt-user{background:var(--lt-soft);margin-left:22px}
    #lt-reading .lt-message-meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:5px;font-size:11px;color:var(--lt-muted);margin-bottom:6px}
    #lt-reading .lt-message-content{font:17px/1.65 Georgia,serif;white-space:pre-line}
    #lt-reading .lt-message .lt-actions{margin-top:12px;gap:6px}
    #lt-reading .lt-message .lt-action{font-size:12px;padding:7px 9px}
    #lt-reading .lt-message-quote{font-size:12px;color:var(--lt-muted);border-left:2px solid var(--lt-teal);padding-left:8px;margin-bottom:9px}
    #lt-reading .lt-compose{background:var(--lt-surface);border:1px solid var(--lt-line);border-radius:10px;padding:13px}
    #lt-reading .lt-compose label{display:block;font-size:12px;font-weight:550;margin-bottom:8px}
    #lt-reading .lt-compose textarea{display:block;width:100%;min-height:82px;resize:vertical;font-size:16px;line-height:1.5;background:var(--lt-bg);color:var(--lt-ink);border:1px solid var(--lt-line);border-radius:7px;padding:10px}
    #lt-reading .lt-compose .lt-actions{margin-top:10px}
    
    #lt-reading .lt-ask-context{background:var(--lt-soft);padding:9px 10px;border-radius:6px;margin-bottom:10px;font-size:12px;overflow-wrap:anywhere}
    #lt-reading .lt-ask-context blockquote{margin:5px 0;font:15px/1.5 Georgia,serif;max-height:none}
    #lt-reading .lt-ask-context button{padding:5px 7px;border:0;background:var(--lt-surface);border-radius:5px;font-size:11px;min-height:32px}
    #lt-reading .lt-ask-context .lt-context-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}
    #lt-reading .lt-qa-status{font-size:12px;color:var(--lt-muted);margin-top:10px;overflow-wrap:anywhere}
    #lt-reading .lt-branches{margin-top:17px;font-size:12px;color:var(--lt-muted)}
    #lt-reading .lt-branches summary{cursor:pointer;min-height:30px}
    #lt-reading .lt-branches button{display:flex;gap:8px;align-items:center;width:100%;padding:9px 8px;background:transparent;border:0;text-align:left;font-size:12px;color:var(--lt-green);border-left:1px solid var(--lt-line);overflow-wrap:anywhere}
    #lt-reading .lt-branch-origin{font-size:13px;color:var(--lt-muted);border-left:2px solid var(--lt-line);padding-left:10px;margin:12px 0;overflow-wrap:anywhere}
    #lt-reading.lt-stacked .lt-columns{grid-template-columns:1fr}
    #lt-reading.lt-stacked .lt-demo{max-width:650px;width:100%;margin:0 auto}
    @media(max-width:700px){#lt-reading .lt-content{padding:22px 20px}#lt-reading .lt-columns{grid-template-columns:1fr;gap:24px}#lt-reading .lt-top{padding:15px 20px}#lt-reading h2{font-size:29px;margin-bottom:22px}#lt-reading .lt-prose{font-size:19px}#lt-reading .lt-demo{padding:16px}}
    @media(pointer:coarse){#lt-reading .lt-joints button,#lt-reading .lt-action,#lt-reading .lt-demofoot button,#lt-reading .lt-progress button{min-height:44px}#lt-reading .lt-progress button{width:44px}#lt-reading input[type="range"]{height:38px}}
    html,body{margin:0;padding:0;color-scheme:light dark;background:light-dark(#faf9f5,#171e20)}
    #lt-reading{min-height:100dvh;border:0;border-radius:0;overflow:visible}
    #lt-reading .lt-top{padding:18px clamp(20px,4vw,64px)}
    #lt-reading .lt-content{max-width:1440px;margin:0 auto;padding:32px clamp(20px,4vw,64px) 24px}
    #lt-reading .lt-columns{grid-template-columns:minmax(0,1.12fr) minmax(0,1fr);column-gap:44px;row-gap:0}
    #lt-reading .lt-reading-pane{display:contents}
    #lt-reading .lt-book-section,#lt-reading .lt-thread{grid-column:1;grid-row:1}
    #lt-reading .lt-qa{grid-column:1;grid-row:2}
    #lt-reading .lt-demo{grid-column:2;grid-row:1 / span 2;position:sticky;top:24px;padding:24px}
    #lt-reading .lt-diagram{height:330px}
    #lt-reading .lt-top-right{display:flex;align-items:center;gap:22px}
    #lt-reading .lt-view-menu{position:relative;font-size:13px}
    #lt-reading .lt-view-menu summary{cursor:pointer;min-height:40px;display:flex;align-items:center;gap:8px}
    #lt-reading .lt-view-options{position:absolute;right:0;top:43px;z-index:10;width:260px;max-width:calc(100vw - 32px);padding:16px;background:var(--lt-surface);border:1px solid var(--lt-line);border-radius:10px;box-shadow:0 12px 30px #0002}
    #lt-reading .lt-view-options label{display:block;margin-bottom:15px;font-size:13px}
    #lt-reading .lt-view-options label:last-child{margin-bottom:0}
    #lt-reading .lt-view-options select{font:inherit;color:var(--lt-ink);background:var(--lt-bg);border:1px solid var(--lt-line);border-radius:5px;min-height:38px;width:100%;margin-top:5px;padding:5px}
    #lt-reading .lt-view-options .lt-view-check{display:flex;gap:9px;align-items:center}
    #lt-reading .lt-view-check input{accent-color:var(--lt-green)}
    #lt-reading .lt-storage-error{margin:0;padding:12px clamp(20px,4vw,64px);border-bottom:1px solid var(--lt-line);background:var(--lt-mark);font-size:13px}
    #lt-reading .lt-storage-error p{margin:0 0 8px}
    
    #lt-reading.lt-stacked .lt-book-section,#lt-reading.lt-stacked .lt-thread{grid-column:1;grid-row:1}
    #lt-reading.lt-stacked .lt-demo{grid-column:1;grid-row:2;position:static;margin-top:25px}
    #lt-reading.lt-stacked .lt-qa{grid-column:1;grid-row:3}
    #lt-reading.lt-stacked .lt-reading-pane{display:contents}
    #lt-reading.lt-stacked .lt-columns{max-width:760px;margin:auto}
    #lt-reading .lt-footer{padding-bottom:12px}
    @media(max-width:860px){#lt-reading .lt-columns{grid-template-columns:minmax(0,1fr);row-gap:0}#lt-reading .lt-book-section,#lt-reading .lt-thread{grid-column:1;grid-row:1}#lt-reading .lt-demo{grid-column:1;grid-row:2;position:static;margin-top:24px}#lt-reading .lt-qa{grid-column:1;grid-row:3}#lt-reading .lt-diagram{height:300px}#lt-reading .lt-content{max-width:760px;padding-top:24px}#lt-reading .lt-top-right{gap:0}}
    @media(max-width:400px){#lt-reading .lt-brand{font-size:15px}#lt-reading .lt-view-menu summary{font-size:12px}#lt-reading .lt-demo{padding:16px}#lt-reading .lt-diagram{height:270px}}
  </style>
  <style>#lt-reading{--lt-axis-a:light-dark(#4d719b,#97b9e1);--lt-axis-b:light-dark(#9b7028,#d6b16c);--lt-axis-c:var(--lt-teal)}
#lt-reading.lt-in-thread .lt-columns{grid-template-columns:minmax(0,760px);gap:0;justify-content:center}
#lt-reading.lt-in-thread .lt-demo{display:none}
#lt-reading.lt-in-thread .lt-thread{background:none;border:0;padding:0;border-radius:0}
#lt-reading.lt-in-thread .lt-qa{border:0;padding-top:18px;margin-top:0}
#lt-reading.lt-in-thread .lt-thread .lt-actions{margin:0 0 14px}
#lt-reading .lt-thread-origin{font-size:12px;color:var(--lt-muted)}
#lt-reading .lt-thread-origin summary{cursor:pointer;min-height:32px}
#lt-reading .lt-thread-origin blockquote{font:16px/1.6 Georgia,serif;margin:7px 0 10px;padding-left:13px;border-left:2px solid var(--lt-line)}
#lt-reading .lt-message-content.lt-rich{white-space:normal}
#lt-reading .lt-rich p{margin:0 0 15px}
#lt-reading .lt-rich p:last-child{margin-bottom:0}
#lt-reading .lt-rich a{color:var(--lt-green);font:12px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-decoration-thickness:1px;text-underline-offset:3px}
#lt-reading .lt-rich strong{font-weight:600}
#lt-reading .lt-concept{border:0;border-bottom:1px dashed var(--lt-green);border-radius:0;padding:0;background:none;color:var(--lt-green);font:inherit!important}
#lt-reading .lt-concept:hover{background:var(--lt-soft)}
#lt-reading .lt-thread-entry{margin-top:16px;color:var(--lt-green)}
#lt-reading .lt-highlight-origin{color:inherit;text-decoration:none;border-bottom:1px dashed var(--lt-green);cursor:pointer;box-decoration-break:clone;-webkit-box-decoration-break:clone}
#lt-reading .lt-highlight-origin mark{padding:2px 0;box-decoration-break:clone;-webkit-box-decoration-break:clone}
#lt-reading .lt-highlight-origin:hover mark{filter:brightness(1.1)}
#lt-reading .lt-highlight-origin:focus-visible{outline:3px solid var(--lt-teal);outline-offset:3px;border-radius:3px}
#lt-reading .lt-rich a.lt-highlight-origin{font:inherit;color:inherit;text-decoration:none}
#lt-reading .lt-link-picker{max-width:min(460px,90vw);max-height:75vh;overflow:auto;border:1px solid var(--lt-line);border-radius:12px;background:var(--lt-surface);color:var(--lt-ink);padding:16px}
#lt-reading .lt-link-picker::backdrop{background:#0006}
#lt-reading .lt-link-picker .lt-action{display:block;text-align:left;margin:8px 0;width:100%;white-space:normal}
#lt-reading .lt-revisions{margin-top:12px;font-size:12px;color:var(--lt-muted)}
#lt-reading .lt-revisions summary{cursor:pointer;padding:6px 0}
#lt-reading .lt-revisions time{display:block;margin-top:10px}
#lt-reading .lt-revisions blockquote{margin:6px 0 16px;padding-left:10px;border-left:2px solid var(--lt-line);white-space:pre-wrap;font-size:15px;color:var(--lt-ink)}
#lt-reading .lt-question-edit label{display:block;font-size:12px;margin-bottom:8px}
#lt-reading .lt-question-edit textarea{width:100%;min-height:90px;font-size:16px;line-height:1.5;padding:10px;border:1px solid var(--lt-line);border-radius:7px;background:var(--lt-bg);color:var(--lt-ink)}
#lt-reading .lt-quote-return{background:none;border:0;border-left:2px solid var(--lt-teal);text-align:left;font:inherit;text-decoration:underline;text-underline-offset:3px}
#lt-reading .lt-linked-origin{border:1px solid var(--lt-line);border-radius:8px;padding:10px 13px}
#lt-reading .lt-linked-origin blockquote{border:0;padding:0;margin-bottom:4px}
#lt-reading .lt-message.lt-visual-message{background:transparent;border:1px solid var(--lt-line)}
#lt-reading .lt-answer-visual{margin:14px 0 0}
#lt-reading .lt-visual-title{font:550 14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin-bottom:14px}
#lt-reading .lt-wrist-pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
#lt-reading .lt-wrist-pair figure{margin:0;min-width:0}
#lt-reading .lt-wrist-pair figcaption{font:550 13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#lt-reading .lt-wrist-pair small{display:block;color:var(--lt-muted);font-size:11px;font-weight:400;margin-top:4px;min-height:30px}
#lt-reading .lt-wrist-pair svg{display:block;width:100%;height:245px;overflow:visible}
#lt-reading .lt-wrist-pair svg text,#lt-reading .lt-torque-svg text{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--lt-muted)}
#lt-reading .lt-wrist-controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:8px 0}
#lt-reading .lt-wrist-controls label{font:12px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}

  <script>/* Browser persistence for one book. Cloud storage will sit behind this boundary. */
(function (scope) {
  'use strict';
  const BOOK = 'modern-robotics-2019-preprint';
  const KEY = 'learning-threads:study:' + BOOK;
  class StudyStorageError extends Error {
    constructor(message, cause) { super(message, { cause }); this.name = 'StudyStorageError'; }
  }
  const check = (condition, message) => { if (!condition) throw new StudyStorageError(message); };
  const isObject = value => value && typeof value === 'object' && !Array.isArray(value);
  const isPage = value => value === 0 || value === 1;
  const validId = value => typeof value === 'string' && /^[a-z][a-z0-9-]*$/i.test(value);
  const checkHistory = history => check(history===undefined || (Array.isArray(history) && history.every(r=>isObject(r)&&typeof r.text==='string'&&typeof r.at==='string'&&Number.isFinite(Date.parse(r.at)))), 'Saved revision history is invalid.');
  function checkAnchor(a,page){
    check(isObject(a)&&validId(a.id)&&a.book===BOOK&&a.page===page&&typeof a.quote==='string'&&Number.isInteger(a.start)&&a.start>=0&&a.end===a.start+a.quote.length&&a.quote.length>0,'Saved source highlight is invalid.');
    check(a.kind===undefined||['book','message'].includes(a.kind),'Saved source type is invalid.');
    if(a.kind==='message')check(validId(a.nodeId)&&validId(a.messageId)&&a.sourceRevision===0,'Saved reply source is invalid.');
  }
  const limits = {R:[[-140,140]],P:[[0,100]],H:[[0,360]],C:[[-140,140],[0,100]],U:[[-60,60],[-60,60]],S:[[-60,60],[-60,60],[-140,140]]};
  function checkVisual(visual) {
    check(isObject(visual) && Object.hasOwn(limits, visual.joint), 'Saved joint is invalid.');
    const bounds=limits[visual.joint];
    check(Array.isArray(visual.values) && visual.values.length === bounds.length && visual.values.every((v,i)=>Number.isFinite(v) && v>=bounds[i][0] && v<=bounds[i][1]), 'Saved joint controls are invalid.');
  }
  function validate(state) {
    check(isObject(state) && isPage(state.page), 'Saved reading place is invalid.');
    check(Array.isArray(state.notes) && state.notes.length===2 && state.notes.every(n=>typeof n==='string'), 'Saved notes are invalid.');
    if(state.noteHistory!==undefined){check(Array.isArray(state.noteHistory)&&state.noteHistory.length===2,'Saved note history is invalid.');state.noteHistory.forEach(checkHistory)}
    if(state.noteEdits!==undefined)check(Array.isArray(state.noteEdits)&&state.noteEdits.length===2&&state.noteEdits.every(n=>n===null||typeof n==='string'),'Saved note edit is invalid.');
    check(Array.isArray(state.noteOpen) && state.noteOpen.length===2 && state.noteOpen.every(n=>typeof n==='boolean'), 'Saved note view is invalid.');
    check(Array.isArray(state.read) && state.read.every(isPage), 'Saved read marks are invalid.');
    check(Array.isArray(state.highlights) && state.highlights.length===2 && state.highlights.every(list=>Array.isArray(list) && list.every(h=>isObject(h) && Number.isInteger(h.start) && h.start>=0 && Number.isInteger(h.end) && h.end>h.start && typeof h.quote==='string' && h.quote.length===h.end-h.start)), 'Saved highlights are invalid.');
    checkVisual({joint:state.joint, values:state.states?.[state.joint]});
    for (const joint of Object.keys(limits)) checkVisual({joint,values:state.states?.[joint]});
    check(isObject(state.design) && ['Side by side','Visual below'].includes(state.design.layout) && Number.isFinite(state.design.textSize) && state.design.textSize>=17 && state.design.textSize<=24 && typeof state.design.surrounding==='boolean', 'Saved reading view is invalid.');
    check(Array.isArray(state.conversations) && state.conversations.length>=2, 'Saved threads are missing.');
    const nodes=new Map(), messageIds=new Set();
    for (const node of state.conversations) {
      check(isObject(node) && validId(node.id) && !nodes.has(node.id) && isPage(node.page), 'Saved thread identity is invalid.');
      check(typeof node.title==='string' && typeof node.draft==='string' && typeof node.quote==='string' && Array.isArray(node.messages) && Array.isArray(node.path), 'Saved thread content is invalid.');
      if (node.visual) checkVisual(node.visual);
      if(node.sourceAnchor)checkAnchor(node.sourceAnchor,node.page);
      if(node.pendingAnchor)checkAnchor(node.pendingAnchor,node.page);
      for (const m of node.messages) {
        check(isObject(m) && validId(m.id) && !messageIds.has(m.id) && ['user','assistant'].includes(m.role) && typeof m.text==='string', 'Saved reply is invalid.');
        check(m.note===undefined || typeof m.note==='string', 'Saved reply note is invalid.');
        checkHistory(m.noteHistory);checkHistory(m.history);
        check(m.noteEditBase===undefined||typeof m.noteEditBase==='string','Saved note edit is invalid.');
        check(m.editDraft===undefined||typeof m.editDraft==='string','Saved question edit is invalid.');
        if(m.request)check(isObject(m.request)&&validId(m.request.id)&&['connecting','queued','running','completed','failed','waiting'].includes(m.request.state)&&isObject(m.request.payload)&&m.request.payload.id===m.request.id&&typeof m.request.payload.question==='string'&&isObject(m.request.payload.context),'Saved assistant request is invalid.');
        if(m.requestId)check(validId(m.requestId),'Saved assistant reply identity is invalid.');
        if(m.sourceAnchor)checkAnchor(m.sourceAnchor,node.page);
        check(m.example===undefined || ['wrist','actuation','torque'].includes(m.example), 'Saved reply example is unknown.');
        if (m.visualization) check(['wrist','actuation','torque'].includes(m.visualization.type) && validId(m.visualization.sourceMessage) && Array.isArray(m.visualization.values) && m.visualization.values.length===3 && m.visualization.values.every(v=>Number.isFinite(v) && Math.abs(v)<=180), 'Saved reply visual is invalid.');
        messageIds.add(m.id);
      }
      nodes.set(node.id,node);
    }
    check(nodes.get('p0')?.page===0 && !nodes.get('p0').parent && nodes.get('p1')?.page===1 && !nodes.get('p1').parent, 'Saved paragraph threads are missing.');
    for (const node of nodes.values()) {
      for(const a of [node.sourceAnchor,node.pendingAnchor,...node.messages.map(m=>m.sourceAnchor)].filter(Boolean)){
        if(a.kind==='message'){
          const source=nodes.get(a.nodeId),message=source?.messages.find(m=>m.id===a.messageId);
          check(source?.page===node.page&&message?.role==='assistant','A saved highlight has lost its reply.');
        }
      }
      const seen=new Set(); let cursor=node;
      while (cursor.parent) {
        check(!seen.has(cursor.id), 'Saved threads contain a cycle.'); seen.add(cursor.id);
        cursor=nodes.get(cursor.parent);
        check(cursor && cursor.page===node.page, 'A saved thread has lost its parent.');
      }
      check(cursor.id==='p'+node.page, 'A saved thread has lost its paragraph.');
      check(node.path.length===seen.size, 'Saved thread path is invalid.');
      let previous='p'+node.page;
      for (const step of node.path) {
        check(isObject(step) && nodes.get(step.id)?.parent===previous && typeof step.title==='string', 'Saved thread path is invalid.');
        checkVisual({joint:step.restoreJoint,values:step.restoreValues}); previous=step.id;
      }
      check(previous===node.id, 'Saved thread path points elsewhere.');
      check(!node.replyTo || node.messages.some(m=>m.id===node.replyTo), 'Saved reply selection is missing.');
    }
    check(nodes.has(state.activeId) && nodes.get(state.activeId).page===state.page, 'Saved active thread is missing.');
    return state;
  }
  function create(getStorage) {
    let baseline=null, loaded=false, revision=0, previousState=null;
    function read() {
      try { return getStorage().getItem(KEY); }
      catch (error) { throw new StudyStorageError('Browser storage is unavailable. Your changes are still on this page. Export a backup.',error); }
    }
    return {
      load() {
        const raw=read();
        if (raw===null) { baseline=null;loaded=true;return null; }
        try {
          const envelope=JSON.parse(raw);
          check([1,2].includes(envelope.version) && envelope.book===BOOK && Number.isSafeInteger(envelope.revision) && envelope.revision>0, 'Saved study format is not supported.');
          const state=validate(envelope.state);
          baseline=raw;revision=envelope.revision;previousState=JSON.stringify(state);loaded=true;
          return state;
        } catch(error) { throw new StudyStorageError('Saved study could not be opened. The saved copy has been left untouched. Export a backup.',error); }
      },
      save(state) {
        check(loaded, 'Saved study could not be opened. Export a backup before restoring it.');
        validate(state);
        check(read()===baseline, 'Study changed in another tab. Export this tab’s work before reloading.');
        const serialized=JSON.stringify(state);
        if (serialized===previousState) return revision;
        const next=JSON.stringify({version:2,book:BOOK,revision:revision+1,updatedAt:new Date().toISOString(),state});
        try { getStorage().setItem(KEY,next); }
        catch(error) { throw new StudyStorageError('Could not save study in this browser. Your changes are still on this page. Export a backup and free some storage, then retry.',error); }
        baseline=next;previousState=serialized;revision++;return revision;
      },
      backup(state) {
        let stored=null,error=null;
        try { stored=read(); } catch(e) { error=e.message; }
        return {version:2,book:BOOK,exportedAt:new Date().toISOString(),state,stored,storageError:error};
      }
    };
  }
  const api={create,validate,KEY,BOOK,StudyStorageError};
  if (typeof module!=='undefined' && module.exports) module.exports=api;
  else scope.LearningStudyStore=api;
})(globalThis);
</script>
  <script>/* Optimistic cloud revisions. Conflicting snapshots stay available for recovery. */
(function(scope){
  'use strict';
  const clone=value=>JSON.parse(JSON.stringify(value));
  const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
  const content=value=>{const copy=clone(value);for(const node of copy?.conversations||[])delete node.scrollY;return copy};
  const newId=()=> 's-'+(scope.crypto?.randomUUID?.()||Date.now().toString(36)+'-'+Math.random().toString(36).slice(2));
  function create({book,storage,apply,status,canApply=()=>true,request=fetch}) {
    const key='learning-threads:sync:'+book;
    let meta={base:0,last:null,pending:null},latest=null,ready=false,working=false,conflict=null,timer;
    function persist(){storage().setItem(key,JSON.stringify(meta))}
    async function api(path,options={}){
      const response=await request('/api/study'+path,{cache:'no-store',...options,headers:{'X-Learning-Threads':'1',...(options.body?{'Content-Type':'application/json'}:{})}});
      const value=await response.json();
      if(!response.ok&&!(response.status===409&&value.head))throw new Error(value.error||'Could not sync study. Keep this page open or export a backup.');
      return value;
    }
    function report(error=null){status({error:error?.message||null,conflict:!!conflict})}
    function acceptHead(head){
      // Apply validates source offsets before changing the saved reading state.
      apply(clone(head.state));latest=clone(head.state);
      meta={base:head.version,last:clone(head.state),pending:null};persist();conflict=null;report();
    }
    async function send(attempt=0){
      if(!meta.pending){meta.pending={id:newId(),book,base:meta.base,state:clone(latest)};persist()}
      const pending=meta.pending,result=await api('',{method:'POST',body:JSON.stringify(pending)});
      if(result.accepted){meta={base:result.version,last:pending.state,pending:null};persist();conflict=null;report();return true}
      // Different viewport heights can update scroll positions just after a
      // resume. They must not create a conflict with a new note or question.
      if(attempt<2&&meta.last&&same(content(result.head.state),content(meta.last))){meta.base=result.head.version;meta.pending=null;persist();return send(attempt+1)}
      if(meta.last&&same(content(latest),content(meta.last))&&canApply()){acceptHead(result.head);return true}
      conflict=result;meta.pending=null;persist();report();return false;
    }
    async function run(fn){
      if(working)return;working=true;
      try{return await fn()}catch(error){report(error)}finally{working=false}
    }
    async function flush(){
      if(!ready||conflict)return;
      await run(async()=>{
        if(meta.pending||!same(latest,meta.last))await send();
      });
      if(!working&&!conflict&&!meta.pending&&!same(latest,meta.last))schedule();
    }
    function schedule(){clearTimeout(timer);timer=setTimeout(flush,800)}
    async function refresh(){
      if(!ready)return;
      if(meta.pending||!same(latest,meta.last)){await flush();return}
      if(!canApply())return;
      await run(async()=>{
        const before=clone(latest),result=await api('');
        if(!same(before,latest)||!canApply())return;
        if(result.head&&result.head.version!==meta.base)acceptHead(result.head);
        else if(!conflict)report();
      });
    }
    return {
      async start(state,hadLocal){
        latest=clone(state);
        await run(async()=>{
          const raw=storage().getItem(key);
          if(raw){meta=JSON.parse(raw);if(!Number.isSafeInteger(meta.base)||meta.base<0)throw new Error('The saved sync state is invalid. Export a backup.')}
          if(meta.pending)await send();
          const atStart=clone(latest),result=await api('');
          if(conflict)return;
          if(!result.head){meta.base=0;await send();return}
          if(same(content(latest),content(result.head.state))){meta={base:result.head.version,last:clone(latest),pending:null};persist();return}
          if((!hadLocal||same(latest,meta.last))&&same(atStart,latest)&&canApply())acceptHead(result.head);
          else await send();
        });
        ready=true;
      },
      observe(state){latest=clone(state);if(ready)schedule()},
      stop(){clearTimeout(timer)},
      refresh,flush,
      async resolve(choice){
        if(working){report(new Error('A save is still running. Try again in a moment.'));return}
        await run(async()=>{
          // Keep the latest local work even if it changed after conflict detection.
          await api('',{method:'POST',body:JSON.stringify({id:newId(),book,base:0,state:latest})});
          const result=await api('');
          if(choice==='cloud'){acceptHead(result.head);return}
          meta.base=result.head?.version||0;meta.pending=null;conflict=null;persist();await send();
        });
      },
      async versions(before){return api('/versions'+(before?'?before='+before:''))},
      async copy(version){return api('/versions/'+version)},

(function(scope){

  function anchor(text,start,end,source){

    if(!entries.length)return;

    const controls=[];
    for(const control of [...container.querySelectorAll('a,button')]){
      const before=document.createRange();before.selectNodeContents(container);before.setEndBefore(control);
      const start=before.toString().length,end=start+control.textContent.length;
      if(!entries.some(e=>e.anchor.start<end&&e.anchor.end>start))continue;
      const action=control.dataset.joint?{joint:control.dataset.joint}:control.dataset.concept?{concept:control.dataset.concept}:control.tagName==='A'?{href:control.getAttribute('href')}:null;
      controls.push({start,end,element:control.cloneNode(false),action});

    // segment instead of creating nested links or damaging the source markup.
    const boundaries=new Set(segments(text.length,entries).flatMap(s=>[s.start,s.end]));

      const cuts=[part.start,...[...boundaries].filter(p=>p>part.start&&p<part.end).sort((a,b)=>a-b),part.end];
      const fragment=document.createDocumentFragment();
      for(let i=0;i<cuts.length-1;i++){
        const start=cuts[i],end=cuts[i+1],value=text.slice(start,end);
        if(end<=start)continue;
        const linked=entries.filter(e=>e.anchor.start<=start&&e.anchor.end>=end);
        const control=controls.find(c=>c.start<=start&&c.end>=end);
        let element;
        if(linked.length){

      quote: 'The spherical joint (S), also called a ball-and-socket joint, has three degrees of freedom and functions much like our shoulder joint.',
      concept: 'Actuation', next: 'actuation', visual: 'wrist', kind: 'conversation',
      text: 'A spherical joint allows three rotational motions. The engineering challenge is driving and controlling those motions. The passage describes what movement a joint permits, without specifying how it is powered.\n\nImagine a camera on a tripod ball head. Loosen it and you can tilt and twist the camera easily. Making it turn to an exact orientation—and hold that orientation against a load—requires additional machinery. That is the problem of actuation.\n\nThree revolute joints give the robot one measurable angle and one axis about which to apply torque at each joint. Conventional rotary motors, gearboxes, bearings, and encoders fit this arrangement well.\n\nWhen the three rotation axes intersect at one point, the assembly is called a spherical wrist. It rotates the tool about that shared centre, within its joint limits and away from singular postures.\n\nA powered ball-and-socket is possible. Spherical motors can generate torque in three dimensions, but require specialised drive, sensing, and control systems. Spherical joints also appear as passive connections in robots such as Stewart platforms.',
      html: () => `<p><strong>A spherical joint allows three rotational motions. The challenge is driving and controlling them.</strong> The passage describes what movement a joint permits, without specifying how it is powered.</p>
        <p>Imagine a camera on a tripod ball head. Loosen it and you can tilt and twist the camera easily. Making it turn to an exact orientation—and hold that orientation against a load—requires additional machinery. That is the problem of ${concept('actuation', 'actuation')}.</p>

        <p>When those three rotation axes intersect at one point, the assembly is called a <strong>spherical wrist</strong>. It rotates the tool about that shared centre, within its joint limits and away from singular postures. “Spherical” describes the resulting motion. ${cite(source.wrist, 'Wrist geometry')}</p>
        <p>A powered ball-and-socket is possible. Spherical motors generate torque in three dimensions, but require specialised drive, sensing, and control systems. ${cite(source.motors, 'Research example')}</p>

      concept: 'Torque', next: 'torque', visual: 'actuation', kind: 'sample',
      text: 'Actuation is how a robot supplies force or torque to produce motion. A joint tells us which motion is allowed. An actuator supplies the effort to make that motion happen.\n\nFor a powered hinge, the motor supplies torque, the transmission carries that torque to the joint, and an encoder measures the angle. A controller compares the measured angle with the desired angle and adjusts the motor.\n\nThe sensor measures; it does not supply the motion. A freely moving ball-and-socket provides three rotational freedoms but needs an actuation system to control its orientation.\n\nBack at the wrist question, three revolute joints make it convenient to drive and measure one angle at a time.',

        <p>For a powered hinge, the motor supplies torque, the transmission carries it to the joint, and an encoder measures the angle. A controller compares the measured angle with the desired angle and adjusts the motor.</p>
        <p>The sensor measures; it does not supply the motion. A freely moving ball-and-socket provides three rotational freedoms but needs an actuation system to control its orientation.</p>

      selectedSource={quote:anchor.quote,nodeId:node.id,messageId};node.pendingAnchor=anchor;node.quote=anchor.quote;node.replyTo=messageId;renderAskContext();saveStudy();
    });
    function applyDesign(){root.classList.toggle('lt-stacked',design.layout==='Visual below');root.style.setProperty('--lt-reading-size',design.textSize+'px');render()}
    const resumed=loadStudy();
    q('.lt-view-options').insertAdjacentHTML('beforeend','<div class="lt-actions"><a class="lt-action" href="#" data-export-study download style="text-decoration:none">Export</a><button class="lt-action" type="button" data-action="restore-study">Restore</button><button class="lt-action" type="button" data-action="saved-copies">Saved copies</button></div>');
    cloudSync=LearningStudySync.create({book:LearningStudyStore.BOOK,storage:()=>window.localStorage,status:syncStatus,canApply:()=>studyLoaded&&!runningRequests.size&&!document.activeElement?.matches('input,textarea'),apply:saved=>{
      validateSourceLinks(saved);applyingCloud=true;
      try{studyStore.save(saved);loadStudy(saved);q('#lt-layout').value=design.layout;q('#lt-text-size').value=design.textSize;q('#lt-size-value').textContent=design.textSize+' px';q('#lt-surrounding').checked=design.surrounding;applyDesign();restoreReadingPosition();saveStudy()}
      finally{applyingCloud=false}
      for(const node of conversations.values())for(const m of node.messages)if(m.request&&['queued','running','connecting'].includes(m.request.state))startReply(node,m);
    }});
    q('#lt-restore-file').addEventListener('change',async event=>{
      const file=event.target.files[0];if(!file)return;
      try{if(file.size>2_000_000)throw new Error('This backup exceeds 2 MB.');const backup=JSON.parse(await file.text());if(backup.book!==LearningStudyStore.BOOK)throw new Error('This backup belongs to another book.');validateSourceLinks(backup.state);await cloudSync.restore(backup.state)}
      catch(error){syncStatus({error:error.message})}finally{event.target.value=''}
    });
    q('#lt-layout').value=design.layout;q('#lt-text-size').value=design.textSize;q('#lt-size-value').textContent=design.textSize+' px';q('#lt-surrounding').checked=design.surrounding;
    applyDesign();new ResizeObserver(draw).observe(q('.lt-diagram'));
    new ResizeObserver(()=>threadExamples.drawVisuals(q('.lt-messages'),activeNode().messages)).observe(q('.lt-messages'));
    q('#lt-layout').addEventListener('change',e=>{design.layout=e.target.value;applyDesign()});
    q('#lt-text-size').addEventListener('input',e=>{design.textSize=+e.target.value;q('#lt-size-value').textContent=e.target.value+' px';applyDesign()});
    q('#lt-surrounding').addEventListener('change',e=>{design.surrounding=e.target.checked;context=false;applyDesign()});
    if(!resumed&&new URLSearchParams(location.search).get('example')==='wrist')openWrist();
    if(!resumed&&new URLSearchParams(location.search).get('example')==='highlight'){openWrist();returnToHighlight(activeNode().id)}
    restoreReadingPosition();
    requestAnimationFrame(()=>{studyReady=true;if(studyLoaded){saveStudy();cloudSync.start(studySnapshot(),resumed);for(const node of conversations.values())for(const m of node.messages)if(m.request&&['queued','running','connecting'].includes(m.request.state))startReply(node,m)}});
    setInterval(()=>{if(document.visibilityState==='visible')cloudSync.refresh()},15000);
    window.addEventListener('online',()=>cloudSync.refresh());
    // Save each edit synchronously after the existing action handler has run.
    for(const event of ['click','input','change','submit'])root.addEventListener(event,()=>queueMicrotask(saveStudy));
    let scrollSave=0;window.addEventListener('scroll',()=>{cancelAnimationFrame(scrollSave);scrollSave=requestAnimationFrame(saveStudy)},{passive:true});
    window.addEventListener('pagehide',()=>{flushNoteEdits();saveStudy()});
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){flushNoteEdits();saveStudy()}});
    window.addEventListener('storage',event=>{if(event.key===LearningStudyStore.KEY)saveStudy()});
  })();
  </script>
</div>

<script src="https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js"></script>
<script>globalThis.lucide?.createIcons({attrs:{width:16,height:16}});</script>
